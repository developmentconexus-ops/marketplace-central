# The Go lint standard. Settled in
# docs/engineering/repo-audit-2026-08-07/GATE-TOPOLOGY.md §2.3a, which exists
# because it was not settled anywhere else: measured 2026-08-07, this repository
# had no linter at all.
#
# The choice principle, from that section: every linter here earns its place by
# catching a failure mode the audit actually found, or by compensating for a
# decision the audit actually made. None is included because it is popular.

version: "2"

run:
  timeout: 10m
  # Test files are the larger half of this module -- 369 `*_test.go` against the
  # non-test tree -- and errcheck findings in a test are as real as any other.
  tests: true

linters:
  # `default: none` and then an explicit list. The alternative, `default:
  # standard` plus additions, makes the enabled set a function of the tool
  # version: an upgrade silently changes what the gate enforces, and the ratchet
  # below would attribute the jump to whoever happened to push that day.
  default: none
  enable:
    # Unchecked errors. The single largest silent-failure class in Go, and
    # nothing here looked for it.
    - errcheck
    # Broad correctness. Supersedes most hand-rolled checks.
    - staticcheck
    # The audit found dead code keeping a retired concept alive --
    # `pgdb.DefaultTenantID` (SEC-8). This finds the rest.
    - unused
    # Assignments that never reach a read.
    - ineffassign
    # These two are the compensating control for the do-not-touch ruling on the
    # 82 hand-written `rows.Next()` loops. Keeping the loops keeps a compile-time
    # type check and keeps the risk of an unchecked `rows.Err()` or an unclosed
    # `rows`. Rejecting `RowToStructByName` without adding these would trade a
    # real risk for nothing.
    - rowserrcheck
    - sqlclosecheck
    # Leaked HTTP response bodies. This codebase is mostly provider HTTP clients.
    - bodyclose
    # `errors.Is` / `errors.As` instead of `==` and type assertions. The
    # mechanical half of issue #7, which bans string-matching on `err.Error()`;
    # this catches the comparison forms that ban does not reach.
    - errorlint
    # Non-exhaustive switches over enumerated types. Directly supports #6's typed
    # error registry and #8's vocabularies -- an unmapped code should not be
    # reachable by omission.
    - exhaustive
    # HTTP requests built without a context.
    - noctx

  # Deliberately absent, as a decision rather than an oversight: `lll`,
  # `gocyclo`, `funlen`, `gocognit`, `dupl` and every other metric linter. They
  # generate volume rather than defects, and a ratchet on a number that means
  # nothing is worse than no ratchet -- it teaches the team that ratchets are
  # noise. Also absent: `depguard`, because archscan and governance already own
  # import boundaries, and two instruments over one rule is how they come to
  # disagree.

  settings:
    errcheck:
      # A deferred Close whose error is dropped is the idiom this codebase is
      # written in, and flagging every one of them would bury the findings that
      # are real. Excluded by function, not by a blanket `check-blank: false`.
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close
    exhaustive:
      # Without this, every switch with a default is reported, which is most of
      # them. A default that handles the unlisted cases is the point of a
      # default.
      default-signifies-exhaustive: true

  exclusions:
    # `generated: lax` skips files carrying the `// Code generated ... DO NOT
    # EDIT.` marker. A finding in generated output is a finding against the
    # generator, and is not actionable at the call site.
    generated: lax
    paths:
      - \.gocache
      - \.gomodcache
    rules:
      # Measured 2026-08-08 on the first run this repository has ever had: noctx
      # reported 276 findings, and 273 of them were in `*_test.go`. The rule
      # earns its place in GATE-TOPOLOGY.md §2.3a as a control over provider HTTP
      # clients -- a request built without a context there cannot be cancelled or
      # deadlined by its caller. A test has no ambient context to propagate; the
      # finding is a fact about `http.NewRequest` being the shorter call, not
      # about the code being wrong.
      #
      # This is a narrowing of the standard, made against a measurement rather
      # than in advance of one, and it is the difference between a ratchet on 3
      # real findings and a ratchet on 276 that nobody will read.
      - linters: [noctx]
        path: _test\.go

formatters:
  # gofmt already runs as its own gate lane (`npm run gate:gofmt`), which fails
  # at zero and has no ratchet. Running it here too would give one rule two
  # instruments and two counts.
  enable: []

issues:
  # The gate counts findings itself and compares against a committed baseline;
  # the defaults cap output at 50 per linter and 3 per identical issue, which
  # would make the count a function of the cap rather than of the code.
  max-issues-per-linter: 0
  max-same-issues: 0
