name: Melhoria ou refactor
description: Nada está errado; algo fica melhor — e a melhora tem de ser medível
labels: ["melhoria"]
body:
  - type: markdown
    attributes:
      value: |
        Refactor sem medida do antes é reescrita com outro nome. O escopo
        declarado aqui é contra o que o PR vai ser verificado no fecho.

  - type: textarea
    id: estado_atual
    attributes:
      label: Estado atual, medido
      description: >
        Onde dói hoje, com número e file:line. Contagem de duplicação, tempo de
        lane, número de chamadores, caminhos que não se conseguem testar.
    validations:
      required: true

  - type: textarea
    id: melhora
    attributes:
      label: O que melhora, e como se mede a melhora
      description: >
        A mesma medida de cima, depois. Se a melhora não tem medida, o issue
        ainda não está pronto para virar trabalho.
    validations:
      required: true

  - type: textarea
    id: pesquisa
    attributes:
      label: Pesquisa — alternativas consideradas, e porquê esta
      description: >
        Pelo menos uma alternativa real e a razão de ter perdido, incluindo
        "não fazer nada". Aqui é onde se evita o máximo local: a primeira
        solução que funciona raramente é a que a arquitetura queria.
    validations:
      required: true

  - type: textarea
    id: escopo_muda
    attributes:
      label: Escopo — o que muda
    validations:
      required: true

  - type: textarea
    id: escopo_nao_muda
    attributes:
      label: Escopo — o que NÃO muda
      description: >
        Tudo que o PR tocar fora do declarado tem de aparecer na secção "fora do
        escopo declarado" do PR, com razão.
    validations:
      required: true

  - type: textarea
    id: aceite
    attributes:
      label: Aceite por medição
      description: Comando + número ou token esperado. Comportamento igual também se mede.
    validations:
      required: true

  - type: textarea
    id: regressao
    attributes:
      label: Risco de regressão, e como se deteta
      description: >
        O que este refactor pode partir em silêncio, e que medição o apanharia.
        Um refactor cujo risco é "nenhum" não foi pensado.
    validations:
      required: true
