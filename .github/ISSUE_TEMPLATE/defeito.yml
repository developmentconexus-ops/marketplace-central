name: Defeito
description: Algo mede errado, falha em silêncio, ou afirma o que não é
labels: ["defeito"]
body:
  - type: markdown
    attributes:
      value: |
        O escopo declarado aqui é contra o que o PR vai ser verificado no fecho.
        Campo por preencher agora é discussão de escopo depois do código escrito.

  - type: textarea
    id: sintoma
    attributes:
      label: Sintoma medido
      description: >
        O que se observou, com número. Saída de comando, contagem no banco, ou
        corpo de erro verbatim. "Parece lento" e "às vezes falha" não são
        sintomas — são impressões.
      placeholder: |
        Re-corrida ao vivo curou 14 de 34 anúncios; os outros 20 saíram
        `idempotent` com `seller_sku_state='unknown'` e o SKU no payload ao lado.
    validations:
      required: true

  - type: textarea
    id: causa
    attributes:
      label: Causa, com file:line
      description: >
        A linha que produz o sintoma, não a camada onde ele aparece. Se ainda
        não é conhecida, diga isso — um issue de investigação é legítimo, um
        palpite disfarçado de causa não.
      placeholder: |
        internal/contexts/listings/internal/application/ingest.go:50 — o fold
        compara `payload_hash`, e a linha gravada é função de DOIS inputs.
    validations:
      required: true

  - type: textarea
    id: escopo_muda
    attributes:
      label: Escopo — o que muda
      description: Ficheiros, tabelas e comportamento que este issue autoriza mexer.
    validations:
      required: true

  - type: textarea
    id: escopo_nao_muda
    attributes:
      label: Escopo — o que NÃO muda
      description: >
        A metade que impede o alastramento. Tudo que o PR tocar fora do que está
        aqui em cima tem de aparecer na secção "fora do escopo declarado" do PR,
        com razão.
    validations:
      required: true

  - type: textarea
    id: aceite
    attributes:
      label: Aceite por medição
      description: >
        Comando + número ou token esperado. Não "o teste passa" — que teste,
        dizendo o quê. Presença não é execução.
      placeholder: |
        `SELECT count(*) FROM listings.listings WHERE seller_sku_state='unknown'`
        devolve 0 depois do reprocesso, e a corrida imprime `changed=20 idempotent=14`.
    validations:
      required: true

  - type: textarea
    id: controlo_positivo
    attributes:
      label: Controlo positivo exigido
      description: >
        Que sabotagem deliberada tem de REPROVAR o aceite acima, e com que
        mensagem. Um aceite que ninguém sabe como falhar não é aceite.
      placeholder: |
        Remover o leitor do atributo SELLER_SKU tem de fazer o teste falhar
        dizendo que a linha não curou — não uma queixa do encanamento do teste.
    validations:
      required: true

  - type: textarea
    id: fora
    attributes:
      label: Não é sobre
      description: Vizinhança que este issue deliberadamente não resolve.
    validations:
      required: false
