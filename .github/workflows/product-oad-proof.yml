name: product-oad-proof

on:
  pull_request:
    paths:
      - 'contracts/api/product/**'
      - 'scripts/verify-product-oad-v2.mjs'
      - 'docs/engineering/rebaseline/D5-B2-OPERATION-ADMISSION-MATRIX.md'
      - 'docs/engineering/rebaseline/D5-B2-W2-SCHEMA-GRAMMAR.md'
      - 'docs/engineering/rebaseline/D5-B2-W4-PERMISSION-CLIENT-CLASS-ENFORCEMENT.md'
      - '.github/workflows/product-oad-proof.yml'

permissions:
  contents: read

jobs:
  product-oad-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Prove canonical Product OAD
        run: node scripts/verify-product-oad-v2.mjs
