name: pr68-fix-publication-indent

on:
  push:
    branches:
      - stage/d6-r2-publication-requirements-wire

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/d6-r2-publication-requirements-wire
          fetch-depth: 0
          persist-credentials: true
      - name: Repair only publication schema indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('contracts/api/product/components.yaml')
          source = path.read_text(encoding='utf-8')
          start_marker = '  PublicationRequirementsContext:\n'
          end_marker = '\n  MarketplaceListingRef:\n'
          assert source.count(start_marker) == 1, 'start marker must be unique'
          assert source.count(end_marker) == 1, 'end marker must be unique'
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          segment = source[start:end]
          lines = segment.splitlines(keepends=True)
          assert any(line.startswith('PublicationSourceCandidateValues:') for line in lines), 'expected dedented candidate schema missing'
          repaired = ''.join(('  ' + line if line.strip() else line) for line in lines)
          updated = source[:start] + repaired + source[end:]
          path.write_text(updated, encoding='utf-8')
          PY

          rm .github/workflows/pr68-fix-publication-indent.yml
          git diff --check
          git diff -- contracts/api/product/components.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add contracts/api/product/components.yaml .github/workflows/pr68-fix-publication-indent.yml
          git commit -m "fix(d6-r2): restore publication schema nesting"
          git push origin HEAD:stage/d6-r2-publication-requirements-wire
