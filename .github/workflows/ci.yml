# Repository CI. Lane implementation and measurement live in scripts/gate.ps1.
#
# Rules this file exists to obey, each one paid for somewhere:
#
#   - No `paths:` at trigger level. A workflow that does not dispatch reports
#     nothing, and a PR waiting on a required context that will never arrive is
#     stuck forever. Job-level `if:` is the supported way to skip work.
#   - `required` is the single aggregator, and its guard is an allowlist. The
#     obvious `contains(needs.*.result, 'failure')` lets `cancelled` through as
#     green. It also asserts the key set of `needs`, so a job added below but
#     never wired into the aggregator fails the gate instead of vanishing from it.
#   - Every lane prints discovered/run counts, and a lane that ran zero units
#     exits non-zero. Skipped and green are otherwise byte-identical.
#   - No lane logic lives in this file. Every step below invokes
#     `scripts/gate.ps1 -Lane <name>`, which is the same file `npm run gate`
#     runs on a developer machine. The checks existed before this workflow, but
#     which ones ran on a given change used to depend on operator memory. A copy
#     of the logic here and another one locally would reproduce that defect in a
#     form that looks like a fix. `pwsh` is preinstalled on `ubuntu-latest`; the
#     npm aliases are a convenience over the same script, never a second
#     implementation.
#   - Toolchain versions are derived, never transcribed: Go from go.mod, Node
#     from .node-version. A hand-copied version is one more enumeration to rot.
#   - Cheap work gates expensive work through `needs:`, so a 20-second format
#     error does not first burn several minutes of compilation.
#   - `persist-credentials: false` on every checkout. The default is true, which
#     leaves GITHUB_TOKEN in the job's git configuration for every later step --
#     including `npm ci`, which runs third-party lifecycle scripts. No step here
#     runs an authenticated git command, and this repository is public.
#
# Branch-protection promotion is external repository configuration. This file
# defines and proves the workflow topology; it does not act as a roadmap/status
# document for when a check becomes required.

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # GOCACHE/GOMODCACHE bind to an ABSOLUTE path for every Go command, the same way
  # scripts/gate.ps1 and AGENTS.md state it. The correction of 2026-07-28 is the
  # reason the literal below is not a relative `GOCACHE=.gocache`: a copy of that
  # form produced an 83-byte EXIT 1 with zero `=== RUN` -- a vacuous green.
  #
  # Declared at JOB level, which puts it in the environment before setup-go runs.
  # setup-go resolves its cache paths from `go env GOCACHE`/`GOMODCACHE`, so
  # declaring it here means the action saves and restores the same directory the
  # lane compiles into. Setting it after setup-go would leave the action caching a
  # path nothing writes to -- honouring the rule while quietly disabling the cache.
  lint-go:
    name: lint-go
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOCACHE: ${{ github.workspace }}/apps/server_core/.gocache
      GOMODCACHE: ${{ github.workspace }}/apps/server_core/.gomodcache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # see header
          # Full history, for one consumer: the governance lane's API<->SDK
          # atomicity check diffs against the PR base SHA, and with the default
          # depth of 1 that commit is not in the local object store -- the diff
          # fails and the lane reports base-sha-unavailable instead of a verdict.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server_core/go.mod
          cache-dependency-path: apps/server_core/go.sum
      # The gate counts, and the counters are what decide PASS. Running their
      # fixtures before the first lane means a weakened guard fails here rather
      # than silently passing everything downstream of it. Placed as a step in
      # the cheapest job for the same reason `go vet` is a step in build-go: a
      # new job would move the `needs`/EXPECTED enumerations the aggregator's
      # topology check exists to keep equal, and this costs about a second.
      - name: gate self-test
        shell: pwsh
        run: ./scripts/tests/gate-measure.tests.ps1

      - name: gofmt
        shell: pwsh
        run: ./scripts/gate.ps1 -Lane gofmt

      # Both halves of scripts/harness/Policy.psm1: the governance registries
      # against their schemas (blocks at zero -- a governance contract that stops
      # parsing has no transitional state) and the semantic drift walk of the
      # tree against them, ratcheted at the current measured baseline. In this
      # job because it needs only pwsh and git, no toolchain.
      #
      # GATE_BASE_SHA feeds exactly one check, API<->SDK atomicity, which is a
      # statement about a change and needs a base to diff against. On a PR that
      # is the PR base; on a push it is the pre-push tip (event.before), so a
      # direct push to main that splits the API from the SDK still fails.
      # event.before is the all-zeros SHA on a newly created ref -- there the
      # expression falls through to the pushed SHA, an empty diff, and the
      # lane's counts line says so.
      - name: governance
        shell: pwsh
        env:
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
        run: ./scripts/gate.ps1 -Lane governance

  lint-frontend:
    name: lint-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # see header
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Prettier first, because it is the cheapest thing in this job and a
      # formatting error should not wait behind a type-aware lint. Blocking at
      # zero and never ratcheted: formatting admits no legitimate exception, so a
      # ratchet would only record how long the drift had been tolerated.
      #
      # Markdown is deliberately out of scope; .prettierignore carries the
      # measurement that put it there.
      - name: prettier --check
        shell: pwsh
        run: ./scripts/gate.ps1 -Lane format

      # --listFiles, not a bare --noEmit: on success tsc prints nothing, so a
      # project whose `include` resolved zero source files exits 0 with the same
      # silence as a clean compile. The lane counts what was loaded.
      - name: tsc --noEmit
        shell: pwsh
        run: ./scripts/gate.ps1 -Lane typecheck

      # ESLint, type-aware, ratcheted at the current measured finding count.
      #
      # The lane asserts coverage before it asserts findings, and that order is
      # the point. `no-floating-promises`, `no-misused-promises` and
      # `await-thenable` need the file to belong to a tsconfig; a file outside
      # `tsconfig.eslint.json` is still reported by ESLint, still contributes zero
      # findings, and is indistinguishable from a clean file. So every tracked
      # .ts/.tsx source must appear in the report or the lane fails, whatever the
      # findings total says.
      - name: eslint
        shell: pwsh
        run: ./scripts/gate.ps1 -Lane lint-web

  build-go:
    name: build-go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-go]
    env:
      GOCACHE: ${{ github.workspace }}/apps/server_core/.gocache
      GOMODCACHE: ${{ github.workspace }}/apps/server_core/.gomodcache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # see header
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server_core/go.mod
          cache-dependency-path: apps/server_core/go.sum
      # The deterministic build lane is `go build ./...` AND `go vet ./...`, so
      # the gate lane runs both. The test lane is not a substitute: `go test`
      # with no -vet flag runs a curated subset of the vet checks (`go help
      # testflag`), so a defect outside that subset -- and vet's own checks over
      # non-test code -- would leave the aggregator green.
      #
      # One job rather than two keeps the build/vet proof in one deterministic
      # lane and avoids unnecessary topology duplication.
      - name: go build + go vet
        shell: pwsh
        run: ./scripts/gate.ps1 -Lane build

      # The architecture detectors -- the rules the compiler cannot express:
      # cross-context internal imports, float in contracts, vendor identity as
      # structure outside the vendor-aware layers, discarded fact booleans. In
      # this job for the same cache reason as golangci-lint below. The detector's
      # current baseline is a measured current-state constraint, not target-design
      # authority.
      - name: archscan
        shell: pwsh
        run: ./scripts/gate.ps1 -Lane arch

      # TestModuleBoundaryADR023 is held as a current-state ratchet. The detector
      # is red on the inherited baseline by design, so test-go-unit skips it and
      # this step runs it, blocking on increase only: a new cross-module import
      # past X/ports fails the PR that writes it. D1 will re-adjudicate the target
      # module boundaries; this gate merely prevents additional drift meantime.
      - name: module boundary (ADR-023)
        shell: pwsh
        run: ./scripts/gate.ps1 -Lane boundary

      # golangci-lint, in this job rather than lint-go, because it type-checks
      # the module and so wants the same toolchain and the same warm build cache
      # that `go build` just filled. Running it in lint-go would compile the
      # module twice per PR to keep a job name honest.
      #
      # It is a ratchet, not a zero. contracts/gate/baselines.json holds the
      # measured numbers and reasons, including runner-platform assumptions.
      - name: golangci-lint
        shell: pwsh
        run: ./scripts/gate.ps1 -Lane lint-go

  test-go-unit:
    name: test-go-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-go]
    env:
      GOCACHE: ${{ github.workspace }}/apps/server_core/.gocache
      GOMODCACHE: ${{ github.workspace }}/apps/server_core/.gomodcache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # see header
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server_core/go.mod
          cache-dependency-path: apps/server_core/go.sum
      # The package set, the -skip of the deliberately red ADR-023 detector, the
      # -count=1 that defeats the test cache, and the run/pass/skip/fail counting
      # all live in the lane -- see `Invoke-GateGoTest` in scripts/gate.ps1, and
      # `Measure-GateGoTest` in scripts/harness/Gate.psm1 for what the counts are
      # taken from. scripts/tests/gate-measure.tests.ps1 holds the fixtures,
      # including the all-skipped suite that exits 0.
      - name: go test ./...
        shell: pwsh
        run: ./scripts/gate.ps1 -Lane test-go

  test-frontend:
    name: test-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # see header
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # vitest colours its summary, so the counts are read after stripping the
      # ANSI escapes -- a bare `^ *Tests` match never fires against the real
      # stream. A run that crashed before printing a summary measures as -1
      # rather than 0: never stated is not the same fact as ran and found none.
      - name: vitest
        shell: pwsh
        run: ./scripts/gate.ps1 -Lane test-web

  # Full verification adds the lanes whose cost is minutes. One job, sequential,
  # because they share a checkout and the two toolchains, and the dominant term
  # (integration, Docker Postgres) cannot be usefully parallelised against the
  # others on one runner. Everything here is `scripts/gate.ps1 -Lane <name>`;
  # `npm run gate:full` selects the same full lane set locally.
  verify-full:
    name: verify-full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-go, lint-frontend]
    env:
      GOCACHE: ${{ github.workspace }}/apps/server_core/.gocache
      GOMODCACHE: ${{ github.workspace }}/apps/server_core/.gomodcache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # see header
          # The selftest lane runs the governance self-tests, which walk
          # history the same way the governance lane does.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server_core/go.mod
          cache-dependency-path: apps/server_core/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      # Census before everything: it is seconds, and a dark test file makes the
      # minutes that follow partially meaningless.
      - name: test-file census
        shell: pwsh
        run: ./scripts/gate.ps1 -Lane census

      # The lane greps .github/ for the privilege-escalating trigger; naming
      # that trigger here would be this workflow's own hit.
      - name: ci hygiene
        shell: pwsh
        run: ./scripts/gate.ps1 -Lane ci-hygiene

      # The gate's own instruments: every non-integration
      # scripts/tests/*.tests.ps1, each required to present a positive pass
      # token. gate-measure runs twice per PR (lint-go runs it as a step);
      # that costs a second and keeps this lane's discovery honest.
      - name: gate self-tests
        shell: pwsh
        run: ./scripts/gate.ps1 -Lane selftest

      # Guard inventory: each entry is held to a fixture that must EXECUTE
      # (go_tests run here; pwsh_files delegate to the selftest step above,
      # verified by precondition + anchor).
      - name: guards
        shell: pwsh
        run: ./scripts/gate.ps1 -Lane guards

      # The hermetic harness fails closed on a missing image (HPG_IMAGE_MISSING)
      # rather than pulling mid-test -- provisioning belongs to the environment,
      # not the measurement. Pull both pinned images up front; the edge lane's
      # first docker run would otherwise mix pull progress into parsed output.
      - name: pre-pull container images
        run: |
          docker pull postgres:16-bookworm
          docker pull caddy:2-alpine

      # Ephemeral Docker Postgres, embedded migrations, no ERP, no dev stack.
      # The lane fails on run<=0 or passed<=0: the harness prints -1 for a test
      # step never reached, and neither -1 nor 0 may pass as green.
      - name: integration (ephemeral postgres)
        shell: pwsh
        run: ./scripts/gate.ps1 -Lane integration

      # PII deny fixture through real Caddy against stub upstreams, Docker only.
      # The lane re-asserts the fixture assertion floor.
      - name: edge PII deny
        shell: pwsh
        run: ./scripts/gate.ps1 -Lane edge

  # ---------------------------------------------------------------------------
  # Single aggregator intended for branch protection.
  # ---------------------------------------------------------------------------
  required:
    name: required
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-go, lint-frontend, build-go, test-go-unit, test-frontend, verify-full]
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      EXPECTED: '["lint-go","lint-frontend","build-go","test-go-unit","test-frontend","verify-full"]'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # see header

      # The runtime guard below compares needs against EXPECTED, which does not
      # catch the case that matters most: a job added to this file and wired into
      # neither. Both lists stay equal to each other and the new job silently
      # leaves the gate. This step reads the workflow itself and asserts that the
      # three enumerations -- the job list, `needs`, and EXPECTED -- are the same
      # set. It is the one line in the gate that resists a hand-synchronised list
      # rotting.
      - name: workflow topology
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          try:
              import yaml
          except ImportError:
              sys.exit("PyYAML is not present on this runner; this check cannot be skipped -- install it explicitly.")
          d = yaml.safe_load(open('.github/workflows/ci.yml', encoding='utf-8'))
          jobs = d['jobs']
          others   = sorted(k for k in jobs if k != 'required')
          needs    = sorted(jobs['required']['needs'])
          expected = sorted(json.loads(jobs['required']['env']['EXPECTED']))
          print('jobs    :', others)
          print('needs   :', needs)
          print('EXPECTED:', expected)
          if not (others == needs == expected):
              sys.exit('topology drift: every job other than `required` must appear in both `needs` and EXPECTED.')
          print('topology: PASS')
          PY

      # The guard is the whole control, so its correctness cannot rest on the
      # author having reasoned about jq correctly. These fixtures make it a
      # measured fact, and they run before the real evaluation on every PR.
      - name: guard self-test
        shell: bash
        run: |
          set -euo pipefail
          guard() {
            jq -e --argjson expected "$EXPECTED" '
              (keys | sort) == ($expected | sort)
              and all(to_entries[]; .value.result == "success" or .value.result == "skipped")
            ' <<<"$1" >/dev/null
          }
          expect() { # expect <want-pass:0|1> <label> <json>
            if guard "$3"; then got=0; else got=1; fi
            if [ "$got" != "$1" ]; then
              echo "guard self-test FAILED: $2 (wanted rc=$1, got rc=$got)"
              exit 1
            fi
            echo "ok: $2"
          }
          all_ok='{"lint-go":{"result":"success"},"lint-frontend":{"result":"success"},"build-go":{"result":"success"},"test-go-unit":{"result":"skipped"},"test-frontend":{"result":"success"},"verify-full":{"result":"success"}}'
          cancelled='{"lint-go":{"result":"success"},"lint-frontend":{"result":"cancelled"},"build-go":{"result":"success"},"test-go-unit":{"result":"success"},"test-frontend":{"result":"success"},"verify-full":{"result":"success"}}'
          failed='{"lint-go":{"result":"failure"},"lint-frontend":{"result":"success"},"build-go":{"result":"success"},"test-go-unit":{"result":"success"},"test-frontend":{"result":"success"},"verify-full":{"result":"success"}}'
          dropped='{"lint-go":{"result":"success"},"lint-frontend":{"result":"success"},"build-go":{"result":"success"},"test-go-unit":{"result":"success"},"test-frontend":{"result":"success"}}'
          added='{"lint-go":{"result":"success"},"lint-frontend":{"result":"success"},"build-go":{"result":"success"},"test-go-unit":{"result":"success"},"test-frontend":{"result":"success"},"verify-full":{"result":"success"},"unwired-job":{"result":"success"}}'
          expect 0 "all success or skipped passes"            "$all_ok"
          expect 1 "a cancelled job blocks"                   "$cancelled"
          expect 1 "a failed job blocks"                      "$failed"
          expect 1 "a job missing from needs blocks"          "$dropped"
          expect 1 "a job not listed in EXPECTED blocks"      "$added"

      - name: every dependency succeeded or was skipped, and none went missing
        shell: bash
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value.result // "null")"'
          # An allowlist, not a denylist. `needs.<job>.result` has exactly four
          # values -- success, failure, cancelled, skipped -- and a denylist on
          # 'failure' passes a cancelled job as green.
          if ! jq -e --argjson expected "$EXPECTED" '
                (keys | sort) == ($expected | sort)
                and all(to_entries[]; .value.result == "success" or .value.result == "skipped")
              ' <<<"$NEEDS_JSON" >/dev/null; then
            echo "required: FAIL -- a dependency did not succeed, or the needs key set drifted from EXPECTED."
            exit 1
          fi
          echo "required: PASS"
