name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      GATE_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
      GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GATE_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@v6
        if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
        with:
          go-version: stable
          cache: false
      - name: quick gate
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
        shell: pwsh
        run: npm run gate
      - name: full gate
        if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
        shell: pwsh
        run: npm run gate:full
