name: pr68-apply-publication-contract

on:
  push:
    branches:
      - stage/d6-r2-publication-requirements-wire

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/d6-r2-publication-requirements-wire
          fetch-depth: 0
          persist-credentials: true
      - name: Apply bounded PublicationRequirements patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('contracts/api/product/components.yaml')
          source = path.read_text(encoding='utf-8')
          start_marker = '  PublicationRequirementsContext:\n'
          end_marker = '\n  MarketplaceListingRef:\n'
          assert source.count(start_marker) == 1, 'PublicationRequirementsContext marker must be unique'
          assert source.count(end_marker) == 1, 'MarketplaceListingRef marker must be unique'
          start = source.index(start_marker)
          end = source.index(end_marker, start)

          replacement = '''  PublicationRequirementsContext:
            type: object
            additionalProperties: false
            properties:
              category_key: {$ref: '#/schemas/OpaqueKey'}
              product_type_key: {$ref: '#/schemas/OpaqueKey'}
          PublicationSourceCandidateValues:
            type: object
            minProperties: 1
            propertyNames: {$ref: '#/schemas/OpaqueKey'}
            additionalProperties: {$ref: '#/schemas/PublicationValue'}
          PublicationSourceEvidenceKnown:
            type: object
            additionalProperties: false
            required: [state, candidates]
            properties: {state: {const: known}, candidates: {$ref: '#/schemas/PublicationSourceCandidateValues'}}
          PublicationSourceEvidenceMissing: {type: object, additionalProperties: false, required: [state], properties: {state: {const: missing}}}
          PublicationSourceEvidenceConflicting:
            type: object
            additionalProperties: false
            required: [state, candidates]
            properties:
              state: {const: conflicting}
              candidates:
                allOf:
                  - {$ref: '#/schemas/PublicationSourceCandidateValues'}
                  - {minProperties: 2}
          PublicationSourceEvidenceUnknown: {type: object, additionalProperties: false, required: [state], properties: {state: {const: unknown}}}
          PublicationSourceEvidenceUnavailable: {type: object, additionalProperties: false, required: [state], properties: {state: {const: unavailable}}}
          PublicationSourceEvidenceUnsupported: {type: object, additionalProperties: false, required: [state], properties: {state: {const: unsupported}}}
          PublicationSourceEvidence:
            oneOf: [{$ref: '#/schemas/PublicationSourceEvidenceKnown'}, {$ref: '#/schemas/PublicationSourceEvidenceMissing'}, {$ref: '#/schemas/PublicationSourceEvidenceConflicting'}, {$ref: '#/schemas/PublicationSourceEvidenceUnknown'}, {$ref: '#/schemas/PublicationSourceEvidenceUnavailable'}, {$ref: '#/schemas/PublicationSourceEvidenceUnsupported'}]
          PublicationTextRequirementSpec:
            type: object
            additionalProperties: false
            required: [kind]
            properties:
              kind: {const: text}
              min_length: {type: integer, minimum: 0}
              max_length: {type: integer, minimum: 0}
          PublicationExactDecimalRequirementSpec:
            type: object
            additionalProperties: false
            required: [kind]
            properties:
              kind: {const: exact_decimal}
              minimum: {$ref: '#/schemas/ExactDecimalString'}
              maximum: {$ref: '#/schemas/ExactDecimalString'}
          PublicationBooleanRequirementSpec: {type: object, additionalProperties: false, required: [kind], properties: {kind: {const: boolean}}}
          PublicationOptionRequirementSpec:
            type: object
            additionalProperties: false
            required: [kind, option_keys]
            properties: {kind: {const: option}, option_keys: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/schemas/OpaqueKey'}}}
          PublicationTextListRequirementSpec:
            type: object
            additionalProperties: false
            required: [kind]
            properties:
              kind: {const: text_list}
              min_items: {type: integer, minimum: 0}
              max_items: {type: integer, minimum: 0}
              item_min_length: {type: integer, minimum: 0}
              item_max_length: {type: integer, minimum: 0}
          PublicationOptionListRequirementSpec:
            type: object
            additionalProperties: false
            required: [kind, option_keys]
            properties:
              kind: {const: option_list}
              option_keys: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/schemas/OpaqueKey'}}
              min_items: {type: integer, minimum: 0}
              max_items: {type: integer, minimum: 0}
          PublicationNumberUnitRequirementSpec:
            type: object
            additionalProperties: false
            required: [kind, unit_keys]
            properties:
              kind: {const: number_unit}
              unit_keys: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/schemas/OpaqueKey'}}
              default_unit_key: {$ref: '#/schemas/OpaqueKey'}
              minimum: {$ref: '#/schemas/ExactDecimalString'}
              maximum: {$ref: '#/schemas/ExactDecimalString'}
          PublicationRequirementValueSpec:
            oneOf: [{$ref: '#/schemas/PublicationTextRequirementSpec'}, {$ref: '#/schemas/PublicationExactDecimalRequirementSpec'}, {$ref: '#/schemas/PublicationBooleanRequirementSpec'}, {$ref: '#/schemas/PublicationOptionRequirementSpec'}, {$ref: '#/schemas/PublicationTextListRequirementSpec'}, {$ref: '#/schemas/PublicationOptionListRequirementSpec'}, {$ref: '#/schemas/PublicationNumberUnitRequirementSpec'}]
          PublicationTextSourceEvidence:
            allOf:
              - {$ref: '#/schemas/PublicationSourceEvidence'}
              - if: {properties: {state: {enum: [known, conflicting]}}, required: [state]}
                then: {properties: {candidates: {type: object, additionalProperties: {$ref: '#/schemas/PublicationTextValue'}}}}
          PublicationExactDecimalSourceEvidence:
            allOf:
              - {$ref: '#/schemas/PublicationSourceEvidence'}
              - if: {properties: {state: {enum: [known, conflicting]}}, required: [state]}
                then: {properties: {candidates: {type: object, additionalProperties: {$ref: '#/schemas/PublicationExactDecimalValue'}}}}
          PublicationBooleanSourceEvidence:
            allOf:
              - {$ref: '#/schemas/PublicationSourceEvidence'}
              - if: {properties: {state: {enum: [known, conflicting]}}, required: [state]}
                then: {properties: {candidates: {type: object, additionalProperties: {$ref: '#/schemas/PublicationBooleanValue'}}}}
          PublicationOptionSourceEvidence:
            allOf:
              - {$ref: '#/schemas/PublicationSourceEvidence'}
              - if: {properties: {state: {enum: [known, conflicting]}}, required: [state]}
                then: {properties: {candidates: {type: object, additionalProperties: {$ref: '#/schemas/PublicationOptionValue'}}}}
          PublicationTextListSourceEvidence:
            allOf:
              - {$ref: '#/schemas/PublicationSourceEvidence'}
              - if: {properties: {state: {enum: [known, conflicting]}}, required: [state]}
                then: {properties: {candidates: {type: object, additionalProperties: {$ref: '#/schemas/PublicationTextListValue'}}}}
          PublicationOptionListSourceEvidence:
            allOf:
              - {$ref: '#/schemas/PublicationSourceEvidence'}
              - if: {properties: {state: {enum: [known, conflicting]}}, required: [state]}
                then: {properties: {candidates: {type: object, additionalProperties: {$ref: '#/schemas/PublicationOptionListValue'}}}}
          PublicationNumberUnitSourceEvidence:
            allOf:
              - {$ref: '#/schemas/PublicationSourceEvidence'}
              - if: {properties: {state: {enum: [known, conflicting]}}, required: [state]}
                then: {properties: {candidates: {type: object, additionalProperties: {$ref: '#/schemas/PublicationNumberUnitValue'}}}}
          PublicationRequirement:
            type: object
            additionalProperties: false
            required: [requirement_key, requirement_class, applicability, value_spec, not_applicable_allowed, source_evidence]
            properties:
              requirement_key: {$ref: '#/schemas/OpaqueKey'}
              requirement_class: {type: string, enum: [required, recommended, optional, conditional]}
              applicability: {type: string, enum: [current, draft_dependent]}
              value_spec: {$ref: '#/schemas/PublicationRequirementValueSpec'}
              not_applicable_allowed: {type: boolean}
              source_evidence: {$ref: '#/schemas/PublicationSourceEvidence'}
            allOf:
              - oneOf:
                  - {properties: {value_spec: {$ref: '#/schemas/PublicationTextRequirementSpec'}, source_evidence: {$ref: '#/schemas/PublicationTextSourceEvidence'}}}
                  - {properties: {value_spec: {$ref: '#/schemas/PublicationExactDecimalRequirementSpec'}, source_evidence: {$ref: '#/schemas/PublicationExactDecimalSourceEvidence'}}}
                  - {properties: {value_spec: {$ref: '#/schemas/PublicationBooleanRequirementSpec'}, source_evidence: {$ref: '#/schemas/PublicationBooleanSourceEvidence'}}}
                  - {properties: {value_spec: {$ref: '#/schemas/PublicationOptionRequirementSpec'}, source_evidence: {$ref: '#/schemas/PublicationOptionSourceEvidence'}}}
                  - {properties: {value_spec: {$ref: '#/schemas/PublicationTextListRequirementSpec'}, source_evidence: {$ref: '#/schemas/PublicationTextListSourceEvidence'}}}
                  - {properties: {value_spec: {$ref: '#/schemas/PublicationOptionListRequirementSpec'}, source_evidence: {$ref: '#/schemas/PublicationOptionListSourceEvidence'}}}
                  - {properties: {value_spec: {$ref: '#/schemas/PublicationNumberUnitRequirementSpec'}, source_evidence: {$ref: '#/schemas/PublicationNumberUnitSourceEvidence'}}}
          SourceMediaCandidate:
            type: object
            additionalProperties: false
            required: [source_media_candidate_key, content_type]
            properties: {source_media_candidate_key: {$ref: '#/schemas/OpaqueKey'}, content_type: {type: string, minLength: 1}}
          PublicationRequirements:
            type: object
            additionalProperties: false
            required: [subject, publication_context, requirements_revision, requirements, source_media_candidates, evaluated_at]
            properties: {subject: {$ref: '#/schemas/ProductChannelReadinessSubject'}, publication_context: {$ref: '#/schemas/PublicationRequirementsContext'}, requirements_revision: {$ref: '#/schemas/OpaqueKey'}, requirements: {type: array, items: {$ref: '#/schemas/PublicationRequirement'}}, source_media_candidates: {type: array, items: {$ref: '#/schemas/SourceMediaCandidate'}}, evaluated_at: {$ref: '#/schemas/Instant'}}
          '''

          updated = source[:start] + replacement + source[end:]
          assert updated != source, 'bounded publication contract patch made no change'
          path.write_text(updated, encoding='utf-8')
          PY

          rm .github/workflows/pr68-apply-publication-contract.yml
          git diff --check
          git diff -- contracts/api/product/components.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add contracts/api/product/components.yaml .github/workflows/pr68-apply-publication-contract.yml
          git commit -m "fix(d6-r2): bind publication source evidence to requirement type"
          git push origin HEAD:stage/d6-r2-publication-requirements-wire
