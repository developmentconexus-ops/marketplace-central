# Step 0 of the adoption sequence: retire the unknowns before designing around them.
# GATE-DESIGN.md section 6 -- "the plan's only self-declared unverified claim is
# scheduled last. Unknowns go first."
#
# The unknown is the integration lane, which is the dominant wall-clock term of any
# future `verify-full`. Measured locally on 2026-08-07, it is narrower than it
# looked: `scripts/harness/Postgres.psm1:334` runs `docker image inspect
# postgres:16-bookworm` and aborts with HPG_IMAGE_MISSING if the image is absent.
# ubuntu-latest ships Docker and pwsh but not that image, so the pull is explicit
# below -- otherwise the lane dies for a reason that is not the code, which is the
# most expensive kind of red.
#
# THIS WORKFLOW IS AN INSTRUMENT, NOT A GATE. It is `workflow_dispatch` only, it
# will never appear in a ruleset, and it is allowed to be red. Its output is a
# measurement that feeds the shape of `verify-full`. If the integration lane cannot
# run on ubuntu-latest, that job changes shape and everything downstream re-plans.
#
# SEQUENCING CONSTRAINT, measured 2026-08-08 and not predicted:
#
#   gh workflow run ci-measure.yml --ref issue-2-ci-workflow
#   HTTP 404: workflow ci-measure.yml not found on the default branch
#
# `workflow_dispatch` is registered from the DEFAULT BRANCH only. `--ref` selects
# which revision of an already-registered workflow runs; it cannot register one.
# So this instrument cannot be fired from the PR that introduces it -- it measures
# nothing until it is merged to main.
#
# That inverts the order this workflow's own header assumes. Step 0 said "unknowns
# go first", and the unknown here is reachable only AFTER the merge. It stays
# harmless in the meantime: dispatch-only, no `push`/`pull_request` trigger, so
# merging it adds no lane to any PR and blocks nothing. The measurement is the
# first thing to run once it lands.

name: ci-measure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-lane:
    name: integration-lane (measurement only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # HARNESS-PROFILE §2: absolute, and declared before setup-go so the action
    # caches the same directory the lane uses. See the note in ci.yml.
    env:
      GOCACHE: ${{ github.workspace }}/apps/server_core/.gocache
      GOMODCACHE: ${{ github.workspace }}/apps/server_core/.gomodcache
    steps:
      - uses: actions/checkout@v7
        with:
          # The governance lane diffs against the merge target's tip, so it needs
          # real history rather than a depth-1 cone.
          fetch-depth: 0
          # `git rev-parse origin/main` below needs no credentials on a public
          # repo, and nothing here pushes. See the note in ci.yml.
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server_core/go.mod
          cache-dependency-path: apps/server_core/go.sum

      - name: environment facts
        shell: bash
        run: |
          echo "pwsh=$(pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')"
          echo "docker=$(docker --version)"
          echo "go=$(go version)"

      - name: pull postgres:16-bookworm
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          docker pull postgres:16-bookworm
          echo "pull_seconds=$((SECONDS - start))"
          docker image inspect postgres:16-bookworm --format '{{.Id}}'

      # HARNESS-PROFILE.md:106 names this exact false alarm: `HPG_MIGRATION_FAILED`
      # with `migrations_first=-1` is the build dying before migrate ever ran,
      # against an empty `.gomodcache` under `GOPROXY=off`, and not a SQL defect.
      # The first CI dispatch (run 31260806782, 2026-08-08) produced precisely that
      # signature in 7 seconds -- `migrations_first=-1 migrations_second=-1
      # resource_count=0` -- so it measured the cold-cache path and not the lane.
      #
      # `Environment.psm1:182-184` pins the lane's GOMODCACHE to this directory and
      # sets GOPROXY=off, so the cache has to be populated from outside the lane or
      # the lane cannot resolve a single module. Downloading here is not part of the
      # measurement: the step is timed separately and reported on its own line.
      - name: warm the module cache the hermetic lane cannot fill itself
        working-directory: apps/server_core
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          go mod download
          echo "warm_seconds=$((SECONDS - start)) modcache=$(go env GOMODCACHE)"
          # An empty cache is the whole failure mode, so assert it is not empty
          # rather than trusting that `go mod download` did something.
          modules=$(find "$(go env GOMODCACHE)/cache/download" -name '*.zip' 2>/dev/null | wc -l)
          echo "modcache_zips=$modules"
          test "$modules" -gt 0

      - name: integration lane
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          set +e
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/harness.ps1 -Command integration 2>&1 | tee /tmp/integration.log
          code=${PIPESTATUS[0]}
          set -e
          # PIPESTATUS is read before any other command runs; `$?` after a pipe
          # records the exit of the last stage, which here is tee and is always 0.
          echo "integration_exit=$code integration_seconds=$((SECONDS - start))"
          exit "$code"

      - name: governance lane
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          set +e
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/harness.ps1 -Command governance -BaseSha "$(git rev-parse origin/main)" 2>&1 | tee /tmp/governance.log
          code=${PIPESTATUS[0]}
          set -e
          echo "governance_exit=$code governance_seconds=$((SECONDS - start))"
          # The integration step above ends in `exit "$code"` and this one did not,
          # so a red governance lane exited with the status of `echo` and the whole
          # measurement reported green -- in the single run whose entire purpose is
          # to establish whether that lane is red. The evidence step is `always()`,
          # so propagating costs no artifact.
          exit "$code"

      - name: evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ci-measure-logs
          path: |
            /tmp/integration.log
            /tmp/governance.log
            scripts/.runs/
          if-no-files-found: warn
