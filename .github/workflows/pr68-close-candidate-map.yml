name: pr68-close-candidate-map

on:
  push:
    branches:
      - stage/d6-r2-publication-requirements-wire

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/d6-r2-publication-requirements-wire
          fetch-depth: 0
          persist-credentials: true
      - name: Close typed candidate maps without weakening OAD closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          components = Path('contracts/api/product/components.yaml')
          text = components.read_text(encoding='utf-8')

          base_old = "    additionalProperties: {$ref: '#/schemas/PublicationValue'}"
          base_new = "    additionalProperties: false\n    patternProperties:\n      '^.+$': {$ref: '#/schemas/PublicationValue'}"
          assert text.count(base_old) == 1, f'expected one base candidate-map value schema, found {text.count(base_old)}'
          text = text.replace(base_old, base_new)

          families = [
              'PublicationTextValue',
              'PublicationExactDecimalValue',
              'PublicationBooleanValue',
              'PublicationOptionValue',
              'PublicationTextListValue',
              'PublicationOptionListValue',
              'PublicationNumberUnitValue',
          ]
          for family in families:
              old = f"then: {{properties: {{candidates: {{type: object, additionalProperties: {{$ref: '#/schemas/{family}'}}}}}}}}"
              new = f"then: {{properties: {{candidates: {{type: object, additionalProperties: false, patternProperties: {{'^.+$': {{$ref: '#/schemas/{family}'}}}}}}}}}}"
              assert text.count(old) == 1, f'expected one typed overlay for {family}, found {text.count(old)}'
              text = text.replace(old, new)

          components.write_text(text, encoding='utf-8')

          reachability = Path('scripts/verify-oad-source-reachability.mjs')
          proof = reachability.read_text(encoding='utf-8')
          old_count = 'publication_requirements_negative_controls=${publicationProof.negativeControls}/8'
          new_count = 'publication_requirements_negative_controls=${publicationProof.negativeControls}/10'
          assert proof.count(old_count) == 1, 'publication proof count marker changed unexpectedly'
          reachability.write_text(proof.replace(old_count, new_count), encoding='utf-8')
          PY

          rm .github/workflows/pr68-close-candidate-map.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add contracts/api/product/components.yaml scripts/verify-oad-source-reachability.mjs .github/workflows/pr68-close-candidate-map.yml
          git commit -m "fix(d6-r2): close typed publication candidate maps"
          git push origin HEAD:stage/d6-r2-publication-requirements-wire
