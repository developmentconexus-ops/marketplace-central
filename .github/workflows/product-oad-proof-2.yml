name: product-oad-proof-2

on:
  pull_request:
    paths:
      - 'contracts/api/product/**'
      - 'scripts/verify-product-oad-v2.mjs'
      - '.github/workflows/product-oad-proof-2.yml'

permissions:
  contents: read

jobs:
  required-product-oad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - run: node scripts/verify-product-oad-v2.mjs
