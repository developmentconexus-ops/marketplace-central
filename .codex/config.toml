#:schema https://developers.openai.com/codex/config-schema.json

[features]
multi_agent = true

[agents]
max_threads = 3
max_depth = 1

[agents."mpc-milestone"]
description = "Own one Marketplace Central milestone and coordinate bounded implementation, review, and QA subagents."
config_file = "agents/mpc-milestone.toml"
nickname_candidates = ["MPC Milestone"]

[agents."mpc-implementer"]
description = "Implement one bounded Marketplace Central vertical work unit without further delegation."
config_file = "agents/mpc-implementer.toml"
nickname_candidates = ["MPC Implementer"]

[agents."mpc-verifier"]
description = "Independently review a frozen SHA or run proportional Marketplace Central QA."
config_file = "agents/mpc-verifier.toml"
nickname_candidates = ["MPC Verifier"]
