pathItems:
  # BASELINE NON-REGRESSION FIXTURE — access pathItems below are retained only so
  # scripts/verify-product-oad.mjs can reconstruct the accepted 95-operation / 29-Permission
  # D5 projection. Canonical openapi.yaml references paths-access-performance.yaml for the
  # current access surface. Do not re-reference these access pathItems as current Product authority.
  AccessContext:
    get:
      operationId: GetCurrentAccessContext
      summary: Get current access context
      x-mpc-operation-class: Q
      x-mpc-required-permission: authenticated
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: IdentityAccess
      responses:
        '200': {description: Current access context., content: {'application/json': {schema: {$ref: '#/schemas/AccessContextView'}}}}
        '401': {$ref: './components.yaml#/responses/AuthenticationRequired'}
        '403': {$ref: './components.yaml#/responses/AccessDenied'}
        '500': {$ref: './components.yaml#/responses/InternalError'}

  OrganizationMembers:
    parameters: [{$ref: './components.yaml#/parameters/OrganizationId'}]
    get:
      operationId: ListOrganizationMembers
      summary: List organization members
      x-mpc-operation-class: Q
      x-mpc-required-permission: access.read
      x-mpc-principal-kinds: [H]
      x-mpc-semantic-owner: IdentityAccess
      parameters: [{$ref: './components.yaml#/parameters/Limit'}, {$ref: './components.yaml#/parameters/Cursor'}]
      responses:
        '200': {description: Organization members., content: {'application/json': {schema: {$ref: '#/schemas/OrganizationMembersCollectionView'}}}}
        '400': {$ref: './components.yaml#/responses/BadRequest'}
        '401': {$ref: './components.yaml#/responses/AuthenticationRequired'}
        '403': {$ref: './components.yaml#/responses/AccessDenied'}
        '404': {$ref: './components.yaml#/responses/ResourceNotFound'}
        '422': {$ref: './components.yaml#/responses/ValidationError'}
        '500': {$ref: './components.yaml#/responses/InternalError'}

  AccessRoles:
    parameters: [{$ref: './components.yaml#/parameters/OrganizationId'}]
    get:
      operationId: ListAccessRoles
      summary: List access roles
      x-mpc-operation-class: Q
      x-mpc-required-permission: access.read
      x-mpc-principal-kinds: [H]
      x-mpc-semantic-owner: IdentityAccess
      parameters: [{$ref: './components.yaml#/parameters/Limit'}, {$ref: './components.yaml#/parameters/Cursor'}]
      responses:
        '200': {description: Access roles., content: {'application/json': {schema: {$ref: '#/schemas/AccessRolesCollectionView'}}}}
        '400': {$ref: './components.yaml#/responses/BadRequest'}
        '401': {$ref: './components.yaml#/responses/AuthenticationRequired'}
        '403': {$ref: './components.yaml#/responses/AccessDenied'}
        '404': {$ref: './components.yaml#/responses/ResourceNotFound'}
        '422': {$ref: './components.yaml#/responses/ValidationError'}
        '500': {$ref: './components.yaml#/responses/InternalError'}

  AssignAccessRole:
    parameters: [{$ref: './components.yaml#/parameters/OrganizationId'}, {$ref: './components.yaml#/parameters/PrincipalId'}]
    post:
      operationId: AssignAccessRole
      summary: Assign access role
      x-mpc-operation-class: C
      x-mpc-required-permission: access.manage
      x-mpc-principal-kinds: [H]
      x-mpc-semantic-owner: IdentityAccess
      requestBody: {required: true, content: {'application/json': {schema: {$ref: './components.yaml#/schemas/RoleMutationRequest'}}}}
      responses:
        '200': {description: Current member access relation., content: {'application/json': {schema: {$ref: '#/schemas/OrganizationMemberView'}}}}
        '401': {$ref: './components.yaml#/responses/AuthenticationRequired'}
        '403': {$ref: './components.yaml#/responses/AccessDenied'}
        '404': {$ref: './components.yaml#/responses/ResourceNotFound'}
        '422': {$ref: './components.yaml#/responses/ValidationError'}
        '500': {$ref: './components.yaml#/responses/InternalError'}

  RevokeAccessRole:
    parameters: [{$ref: './components.yaml#/parameters/OrganizationId'}, {$ref: './components.yaml#/parameters/PrincipalId'}]
    post:
      operationId: RevokeAccessRole
      summary: Revoke access role
      x-mpc-operation-class: C
      x-mpc-required-permission: access.manage
      x-mpc-principal-kinds: [H]
      x-mpc-semantic-owner: IdentityAccess
      requestBody: {required: true, content: {'application/json': {schema: {$ref: './components.yaml#/schemas/RoleMutationRequest'}}}}
      responses:
        '200': {description: Current member access relation., content: {'application/json': {schema: {$ref: '#/schemas/OrganizationMemberView'}}}}
        '401': {$ref: './components.yaml#/responses/AuthenticationRequired'}
        '403': {$ref: './components.yaml#/responses/AccessDenied'}
        '404': {$ref: './components.yaml#/responses/ResourceNotFound'}
        '422': {$ref: './components.yaml#/responses/ValidationError'}
        '500': {$ref: './components.yaml#/responses/InternalError'}

  MarketplaceInstallations:
    parameters: [{$ref: './components.yaml#/parameters/OrganizationId'}]
    get:
      operationId: ListMarketplaceInstallations
      summary: List marketplace installations
      x-mpc-operation-class: Q
      x-mpc-required-permission: portfolio.read
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: MarketplacePortfolio
      parameters: [{$ref: './components.yaml#/parameters/Limit'}, {$ref: './components.yaml#/parameters/Cursor'}]
      responses:
        '200': {description: Marketplace installations., content: {'application/json': {schema: {$ref: './components.yaml#/schemas/MarketplaceInstallationsCollection'}}}}
        '400': {$ref: './components.yaml#/responses/BadRequest'}
        '401': {$ref: './components.yaml#/responses/AuthenticationRequired'}
        '403': {$ref: './components.yaml#/responses/AccessDenied'}
        '404': {$ref: './components.yaml#/responses/ResourceNotFound'}
        '422': {$ref: './components.yaml#/responses/ValidationError'}
        '500': {$ref: './components.yaml#/responses/InternalError'}
    post:
      operationId: CreateMarketplaceInstallation
      summary: Create marketplace installation
      x-mpc-operation-class: C
      x-mpc-required-permission: portfolio.manage
      x-mpc-principal-kinds: [H]
      x-mpc-semantic-owner: MarketplacePortfolio
      parameters: [{$ref: './components.yaml#/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {'application/json': {schema: {$ref: './components.yaml#/schemas/CreateMarketplaceInstallationRequest'}}}}
      responses:
        '201': {$ref: './components.yaml#/responses/MarketplaceInstallationCreated'}
        '400': {$ref: './components.yaml#/responses/BadRequest'}
        '401': {$ref: './components.yaml#/responses/AuthenticationRequired'}
        '403': {$ref: './components.yaml#/responses/AccessDenied'}
        '404': {$ref: './components.yaml#/responses/ResourceNotFound'}
        '409': {$ref: './components.yaml#/responses/Conflict'}
        '422': {$ref: './components.yaml#/responses/ValidationError'}
        '500': {$ref: './components.yaml#/responses/InternalError'}

  MarketplaceInstallation:
    parameters: [{$ref: './components.yaml#/parameters/OrganizationId'}, {$ref: './components.yaml#/parameters/MarketplaceInstallationId'}]
    get:
      operationId: GetMarketplaceInstallation
      summary: Get marketplace installation
      x-mpc-operation-class: Q
      x-mpc-required-permission: portfolio.read
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: MarketplacePortfolio
      responses:
        '200': {$ref: './components.yaml#/responses/MarketplaceInstallationOk'}
        '401': {$ref: './components.yaml#/responses/AuthenticationRequired'}
        '403': {$ref: './components.yaml#/responses/AccessDenied'}
        '404': {$ref: './components.yaml#/responses/ResourceNotFound'}
        '500': {$ref: './components.yaml#/responses/InternalError'}
    patch:
      operationId: UpdateMarketplaceInstallationConfiguration
      summary: Update marketplace installation configuration
      x-mpc-operation-class: C
      x-mpc-required-permission: portfolio.manage
      x-mpc-principal-kinds: [H]
      x-mpc-semantic-owner: MarketplacePortfolio
      parameters: [{$ref: './components.yaml#/parameters/IfMatch'}]
      requestBody: {required: true, content: {'application/json': {schema: {$ref: './components.yaml#/schemas/UpdateMarketplaceInstallationRequest'}}}}
      responses:
        '200': {$ref: './components.yaml#/responses/MarketplaceInstallationOk'}
        '401': {$ref: './components.yaml#/responses/AuthenticationRequired'}
        '403': {$ref: './components.yaml#/responses/AccessDenied'}
        '404': {$ref: './components.yaml#/responses/ResourceNotFound'}
        '412': {$ref: './components.yaml#/responses/PreconditionFailed'}
        '422': {$ref: './components.yaml#/responses/ValidationError'}
        '428': {$ref: './components.yaml#/responses/PreconditionRequired'}
        '500': {$ref: './components.yaml#/responses/InternalError'}

  DeactivateMarketplaceInstallation:
    parameters: [{$ref: './components.yaml#/parameters/OrganizationId'}, {$ref: './components.yaml#/parameters/MarketplaceInstallationId'}]
    post:
      operationId: DeactivateMarketplaceInstallation
      summary: Deactivate marketplace installation
      x-mpc-operation-class: C
      x-mpc-required-permission: portfolio.manage
      x-mpc-principal-kinds: [H]
      x-mpc-semantic-owner: MarketplacePortfolio
      requestBody: {required: true, content: {'application/json': {schema: {$ref: './components.yaml#/schemas/EtagOnlyRequest'}}}}
      responses:
        '200': {description: Deactivated installation and current validator., content: {'application/json': {schema: {$ref: './components.yaml#/schemas/MarketplaceInstallationMutationResult'}}}}
        '401': {$ref: './components.yaml#/responses/AuthenticationRequired'}
        '403': {$ref: './components.yaml#/responses/AccessDenied'}
        '404': {$ref: './components.yaml#/responses/ResourceNotFound'}
        '409': {$ref: './components.yaml#/responses/Conflict'}
        '422': {$ref: './components.yaml#/responses/ValidationError'}
        '500': {$ref: './components.yaml#/responses/InternalError'}

  SellingEntities:
    parameters: [{$ref: './components.yaml#/parameters/OrganizationId'}]
    get:
      operationId: ListSellingEntities
      summary: List selling entities
      x-mpc-operation-class: Q
      x-mpc-required-permission: portfolio.read
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: MarketplacePortfolio
      parameters: [{$ref: './components.yaml#/parameters/Limit'}, {$ref: './components.yaml#/parameters/Cursor'}]
      responses:
        '200': {description: Selling entities., content: {'application/json': {schema: {$ref: './components.yaml#/schemas/SellingEntitiesCollection'}}}}
        '400': {$ref: './components.yaml#/responses/BadRequest'}
        '401': {$ref: './components.yaml#/responses/AuthenticationRequired'}
        '403': {$ref: './components.yaml#/responses/AccessDenied'}
        '404': {$ref: './components.yaml#/responses/ResourceNotFound'}
        '422': {$ref: './components.yaml#/responses/ValidationError'}
        '500': {$ref: './components.yaml#/responses/InternalError'}

  SourceProductsSearch:
    parameters: [{$ref: './components.yaml#/parameters/OrganizationId'}]
    get:
      operationId: SearchSourceProductsForMarketplace
      summary: Search source products for marketplace
      description: >-
        Bounded marketplace-operating search only; never an unfiltered Product-master listing operation.
        source_instance_id is an optional narrowing filter. When omitted, Readiness searches the
        Organization-scoped SourceInstances currently admitted/configured for this search context.
        Every returned product remains explicitly source-qualified; omission never selects an ambient
        or default SourceInstance.
      x-mpc-operation-class: Q
      x-mpc-required-permission: readiness.read
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: ProductChannelReadiness
      parameters:
        - {$ref: './components.yaml#/parameters/MarketplaceInstallationQuery'}
        - name: source_instance_id
          in: query
          required: false
          description: Optional exact SourceInstance narrowing filter; omission is multi-source search scope, never default-source selection.
          schema: {$ref: './components.yaml#/schemas/OpaqueId'}
        - {$ref: './components.yaml#/parameters/SearchQuery'}
        - {$ref: './components.yaml#/parameters/Limit'}
        - {$ref: './components.yaml#/parameters/Cursor'}
      responses:
        '200': {description: Source-qualified Product search evidence., content: {'application/json': {schema: {$ref: './components.yaml#/schemas/SourceProductsSearchCollection'}}}}
        '400': {$ref: './components.yaml#/responses/BadRequest'}
        '401': {$ref: './components.yaml#/responses/AuthenticationRequired'}
        '403': {$ref: './components.yaml#/responses/AccessDenied'}
        '404': {$ref: './components.yaml#/responses/ResourceNotFound'}
        '422': {$ref: './components.yaml#/responses/ValidationError'}
        '500': {$ref: './components.yaml#/responses/InternalError'}

  ProductChannelReadiness:
    parameters: [{$ref: './components.yaml#/parameters/OrganizationId'}]
    get:
      operationId: GetProductChannelReadiness
      summary: Get product channel readiness
      x-mpc-operation-class: Q
      x-mpc-required-permission: readiness.read
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: ProductChannelReadiness
      parameters: [{$ref: './components.yaml#/parameters/MarketplaceInstallationQuery'}, {$ref: './components.yaml#/parameters/SourceInstanceQuery'}, {$ref: './components.yaml#/parameters/NativeProductKeyQuery'}]
      responses:
        '200': {description: Current product channel readiness., content: {'application/json': {schema: {$ref: './components.yaml#/schemas/ProductChannelReadiness'}}}}
        '401': {$ref: './components.yaml#/responses/AuthenticationRequired'}
        '403': {$ref: './components.yaml#/responses/AccessDenied'}
        '404': {$ref: './components.yaml#/responses/ResourceNotFound'}
        '422': {$ref: './components.yaml#/responses/ValidationError'}
        '500': {$ref: './components.yaml#/responses/InternalError'}

  PublicationRequirements:
    parameters: [{$ref: './components.yaml#/parameters/OrganizationId'}]
    get:
      operationId: GetPublicationRequirements
      summary: Get publication requirements
      x-mpc-operation-class: Q
      x-mpc-required-permission: readiness.read
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: ProductChannelReadiness
      parameters:
        - {$ref: './components.yaml#/parameters/MarketplaceInstallationQuery'}
        - {$ref: './components.yaml#/parameters/SourceInstanceQuery'}
        - {$ref: './components.yaml#/parameters/NativeProductKeyQuery'}
        - {name: category_key, in: query, required: false, schema: {$ref: './components.yaml#/schemas/OpaqueKey'}}
        - {name: product_type_key, in: query, required: false, schema: {$ref: './components.yaml#/schemas/OpaqueKey'}}
      responses:
        '200': {description: Current publication requirements., content: {'application/json': {schema: {$ref: './components.yaml#/schemas/PublicationRequirements'}}}}
        '401': {$ref: './components.yaml#/responses/AuthenticationRequired'}
        '403': {$ref: './components.yaml#/responses/AccessDenied'}
        '404': {$ref: './components.yaml#/responses/ResourceNotFound'}
        '422': {$ref: './components.yaml#/responses/ValidationError'}
        '500': {$ref: './components.yaml#/responses/InternalError'}

  ResolveProductChannelCorrespondence:
    parameters: [{$ref: './components.yaml#/parameters/OrganizationId'}]
    post:
      operationId: ResolveProductChannelCorrespondence
      summary: Resolve product channel correspondence
      x-mpc-operation-class: C
      x-mpc-required-permission: readiness.manage
      x-mpc-principal-kinds: [H, A]
      x-mpc-semantic-owner: ProductChannelReadiness
      requestBody: {required: true, content: {'application/json': {schema: {$ref: './components.yaml#/schemas/ResolveCorrespondenceRequest'}}}}
      responses:
        '200': {description: Current product channel readiness., content: {'application/json': {schema: {$ref: './components.yaml#/schemas/ProductChannelReadiness'}}}}
        '401': {$ref: './components.yaml#/responses/AuthenticationRequired'}
        '403': {$ref: './components.yaml#/responses/AccessDenied'}
        '404': {$ref: './components.yaml#/responses/ResourceNotFound'}
        '409': {$ref: './components.yaml#/responses/Conflict'}
        '422': {$ref: './components.yaml#/responses/ValidationError'}
        '500': {$ref: './components.yaml#/responses/InternalError'}

  ClearProductChannelCorrespondence:
    parameters: [{$ref: './components.yaml#/parameters/OrganizationId'}]
    post:
      operationId: ClearProductChannelCorrespondence
      summary: Clear product channel correspondence
      x-mpc-operation-class: C
      x-mpc-required-permission: readiness.manage
      x-mpc-principal-kinds: [H, A]
      x-mpc-semantic-owner: ProductChannelReadiness
      requestBody: {required: true, content: {'application/json': {schema: {$ref: './components.yaml#/schemas/ClearCorrespondenceRequest'}}}}
      responses:
        '200': {description: Current product channel readiness., content: {'application/json': {schema: {$ref: './components.yaml#/schemas/ProductChannelReadiness'}}}}
        '401': {$ref: './components.yaml#/responses/AuthenticationRequired'}
        '403': {$ref: './components.yaml#/responses/AccessDenied'}
        '404': {$ref: './components.yaml#/responses/ResourceNotFound'}
        '409': {$ref: './components.yaml#/responses/Conflict'}
        '422': {$ref: './components.yaml#/responses/ValidationError'}
        '500': {$ref: './components.yaml#/responses/InternalError'}

# BASELINE NON-REGRESSION FIXTURE — the presentation/access schemas below support only
# the retained access pathItems above for the accepted 95/29 projection. The current
# Product access schemas live in paths-access-performance.yaml and carry the effective
# 30-Permission vocabulary. These aliases are not a second current access authority.
schemas:
  PresentationLabel:
    type: string
    minLength: 1
    description: Mutable non-unique human-readable presentation metadata; never canonical identity, Organization scope, correlation or authorization authority.

  AccessContextView:
    type: object
    additionalProperties: false
    required: [principal_id, principal_kind, display_name, organizations]
    properties:
      principal_id: {$ref: './components.yaml#/schemas/OpaqueId'}
      principal_kind: {$ref: './components.yaml#/schemas/PrincipalKind'}
      display_name: {$ref: '#/schemas/PresentationLabel'}
      organizations: {type: array, items: {$ref: '#/schemas/OrganizationAccessView'}}

  OrganizationAccessView:
    type: object
    additionalProperties: false
    required: [organization_id, display_name, role_keys, permissions]
    properties:
      organization_id: {$ref: './components.yaml#/schemas/OpaqueId'}
      display_name: {$ref: '#/schemas/PresentationLabel'}
      role_keys: {type: array, uniqueItems: true, items: {$ref: './components.yaml#/schemas/OpaqueKey'}}
      permissions: {type: array, uniqueItems: true, items: {$ref: './components.yaml#/schemas/Permission'}}

  OrganizationMemberView:
    type: object
    additionalProperties: false
    required: [principal_id, principal_kind, display_name, role_keys]
    properties:
      principal_id: {$ref: './components.yaml#/schemas/OpaqueId'}
      principal_kind: {$ref: './components.yaml#/schemas/PrincipalKind'}
      display_name: {$ref: '#/schemas/PresentationLabel'}
      role_keys: {type: array, uniqueItems: true, items: {$ref: './components.yaml#/schemas/OpaqueKey'}}

  OrganizationMembersCollectionView:
    type: object
    additionalProperties: false
    required: [members]
    properties:
      members: {type: array, items: {$ref: '#/schemas/OrganizationMemberView'}}
      next_cursor: {$ref: './components.yaml#/schemas/OpaqueKey'}

  AccessRoleView:
    type: object
    additionalProperties: false
    required: [role_key, display_name, permissions]
    properties:
      role_key: {$ref: './components.yaml#/schemas/OpaqueKey'}
      display_name: {$ref: '#/schemas/PresentationLabel'}
      permissions: {type: array, uniqueItems: true, items: {$ref: './components.yaml#/schemas/Permission'}}

  AccessRolesCollectionView:
    type: object
    additionalProperties: false
    required: [access_roles]
    properties:
      access_roles: {type: array, items: {$ref: '#/schemas/AccessRoleView'}}
      next_cursor: {$ref: './components.yaml#/schemas/OpaqueKey'}
