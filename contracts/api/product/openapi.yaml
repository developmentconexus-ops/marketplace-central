openapi: 3.1.2
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Marketplace Central Product API
  version: 1.0.0-d5
  description: >-
    Canonical Product API wire description derived from the accepted D5 Product contract.
    This document defines Product wire shape only. Active runtime is NONE and implementation
    remains blocked until D9.
security:
  - MpcBearerAuth: []

paths:
  '/access-context':
    get:
      operationId: GetCurrentAccessContext
      summary: Get current access context
      x-mpc-operation-class: Q
      x-mpc-required-permission: authenticated
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: IdentityAccess
      responses:
        '200': {description: Current access context., content: {'application/json': {schema: {$ref: '#/components/schemas/AccessContext'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/members':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}]
    get:
      operationId: ListOrganizationMembers
      summary: List organization members
      x-mpc-operation-class: Q
      x-mpc-required-permission: access.read
      x-mpc-principal-kinds: [H]
      x-mpc-semantic-owner: IdentityAccess
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Organization members., content: {'application/json': {schema: {$ref: '#/components/schemas/OrganizationMembersCollection'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/access-roles':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}]
    get:
      operationId: ListAccessRoles
      summary: List access roles
      x-mpc-operation-class: Q
      x-mpc-required-permission: access.read
      x-mpc-principal-kinds: [H]
      x-mpc-semantic-owner: IdentityAccess
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Access roles., content: {'application/json': {schema: {$ref: '#/components/schemas/AccessRolesCollection'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/members/{principal_id}:assign-access-role':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}, {$ref: '#/components/parameters/PrincipalId'}]
    post:
      operationId: AssignAccessRole
      summary: Assign access role
      x-mpc-operation-class: C
      x-mpc-required-permission: access.manage
      x-mpc-principal-kinds: [H]
      x-mpc-semantic-owner: IdentityAccess
      requestBody: {required: true, content: {'application/json': {schema: {$ref: '#/components/schemas/RoleMutationRequest'}}}}
      responses:
        '200': {description: Current member access relation., content: {'application/json': {schema: {$ref: '#/components/schemas/OrganizationMember'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/members/{principal_id}:revoke-access-role':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}, {$ref: '#/components/parameters/PrincipalId'}]
    post:
      operationId: RevokeAccessRole
      summary: Revoke access role
      x-mpc-operation-class: C
      x-mpc-required-permission: access.manage
      x-mpc-principal-kinds: [H]
      x-mpc-semantic-owner: IdentityAccess
      requestBody: {required: true, content: {'application/json': {schema: {$ref: '#/components/schemas/RoleMutationRequest'}}}}
      responses:
        '200': {description: Current member access relation., content: {'application/json': {schema: {$ref: '#/components/schemas/OrganizationMember'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/marketplace-installations':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}]
    get:
      operationId: ListMarketplaceInstallations
      summary: List marketplace installations
      x-mpc-operation-class: Q
      x-mpc-required-permission: portfolio.read
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: MarketplacePortfolio
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Marketplace installations., content: {'application/json': {schema: {$ref: '#/components/schemas/MarketplaceInstallationsCollection'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: CreateMarketplaceInstallation
      summary: Create marketplace installation
      x-mpc-operation-class: C
      x-mpc-required-permission: portfolio.manage
      x-mpc-principal-kinds: [H]
      x-mpc-semantic-owner: MarketplacePortfolio
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {'application/json': {schema: {$ref: '#/components/schemas/CreateMarketplaceInstallationRequest'}}}}
      responses:
        '201': {$ref: '#/components/responses/MarketplaceInstallationCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/marketplace-installations/{marketplace_installation_id}':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}, {$ref: '#/components/parameters/MarketplaceInstallationId'}]
    get:
      operationId: GetMarketplaceInstallation
      summary: Get marketplace installation
      x-mpc-operation-class: Q
      x-mpc-required-permission: portfolio.read
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: MarketplacePortfolio
      responses:
        '200': {$ref: '#/components/responses/MarketplaceInstallationOk'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: UpdateMarketplaceInstallationConfiguration
      summary: Update marketplace installation configuration
      x-mpc-operation-class: C
      x-mpc-required-permission: portfolio.manage
      x-mpc-principal-kinds: [H]
      x-mpc-semantic-owner: MarketplacePortfolio
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {'application/json': {schema: {$ref: '#/components/schemas/UpdateMarketplaceInstallationRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/MarketplaceInstallationOk'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/marketplace-installations/{marketplace_installation_id}:deactivate':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}, {$ref: '#/components/parameters/MarketplaceInstallationId'}]
    post:
      operationId: DeactivateMarketplaceInstallation
      summary: Deactivate marketplace installation
      x-mpc-operation-class: C
      x-mpc-required-permission: portfolio.manage
      x-mpc-principal-kinds: [H]
      x-mpc-semantic-owner: MarketplacePortfolio
      requestBody: {required: true, content: {'application/json': {schema: {$ref: '#/components/schemas/EtagOnlyRequest'}}}}
      responses:
        '200': {description: Deactivated installation and current validator., content: {'application/json': {schema: {$ref: '#/components/schemas/MarketplaceInstallationMutationResult'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/selling-entities':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}]
    get:
      operationId: ListSellingEntities
      summary: List selling entities
      x-mpc-operation-class: Q
      x-mpc-required-permission: portfolio.read
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: MarketplacePortfolio
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Selling entities., content: {'application/json': {schema: {$ref: '#/components/schemas/SellingEntitiesCollection'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/source-products':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}]
    get:
      operationId: SearchSourceProductsForMarketplace
      summary: Search source products for marketplace
      description: This is a bounded search and never an unfiltered Product-master listing operation.
      x-mpc-operation-class: Q
      x-mpc-required-permission: readiness.read
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: ProductChannelReadiness
      parameters:
        - {$ref: '#/components/parameters/MarketplaceInstallationQuery'}
        - {$ref: '#/components/parameters/SourceInstanceQuery'}
        - {$ref: '#/components/parameters/SearchQuery'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Source-product search evidence., content: {'application/json': {schema: {$ref: '#/components/schemas/SourceProductsSearchCollection'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/product-channel-readiness':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}]
    get:
      operationId: GetProductChannelReadiness
      summary: Get product channel readiness
      x-mpc-operation-class: Q
      x-mpc-required-permission: readiness.read
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: ProductChannelReadiness
      parameters:
        - {$ref: '#/components/parameters/MarketplaceInstallationQuery'}
        - {$ref: '#/components/parameters/SourceInstanceQuery'}
        - {$ref: '#/components/parameters/NativeProductKeyQuery'}
      responses:
        '200': {description: Current product channel readiness., content: {'application/json': {schema: {$ref: '#/components/schemas/ProductChannelReadiness'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/publication-requirements':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}]
    get:
      operationId: GetPublicationRequirements
      summary: Get publication requirements
      x-mpc-operation-class: Q
      x-mpc-required-permission: readiness.read
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: ProductChannelReadiness
      parameters:
        - {$ref: '#/components/parameters/MarketplaceInstallationQuery'}
        - {$ref: '#/components/parameters/SourceInstanceQuery'}
        - {$ref: '#/components/parameters/NativeProductKeyQuery'}
        - {name: category_key, in: query, required: false, schema: {$ref: '#/components/schemas/OpaqueKey'}}
        - {name: product_type_key, in: query, required: false, schema: {$ref: '#/components/schemas/OpaqueKey'}}
      responses:
        '200': {description: Current publication requirements., content: {'application/json': {schema: {$ref: '#/components/schemas/PublicationRequirements'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/product-channel-readiness:resolve-correspondence':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}]
    post:
      operationId: ResolveProductChannelCorrespondence
      summary: Resolve product channel correspondence
      x-mpc-operation-class: C
      x-mpc-required-permission: readiness.manage
      x-mpc-principal-kinds: [H, A]
      x-mpc-semantic-owner: ProductChannelReadiness
      requestBody: {required: true, content: {'application/json': {schema: {$ref: '#/components/schemas/ResolveCorrespondenceRequest'}}}}
      responses:
        '200': {description: Current product channel readiness., content: {'application/json': {schema: {$ref: '#/components/schemas/ProductChannelReadiness'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/product-channel-readiness:clear-correspondence':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}]
    post:
      operationId: ClearProductChannelCorrespondence
      summary: Clear product channel correspondence
      x-mpc-operation-class: C
      x-mpc-required-permission: readiness.manage
      x-mpc-principal-kinds: [H, A]
      x-mpc-semantic-owner: ProductChannelReadiness
      requestBody: {required: true, content: {'application/json': {schema: {$ref: '#/components/schemas/ClearCorrespondenceRequest'}}}}
      responses:
        '200': {description: Current product channel readiness., content: {'application/json': {schema: {$ref: '#/components/schemas/ProductChannelReadiness'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/marketplace-installations/{marketplace_installation_id}/listings':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}, {$ref: '#/components/parameters/MarketplaceInstallationId'}]
    get:
      operationId: ListMarketplaceListings
      summary: List marketplace listings
      x-mpc-operation-class: Q
      x-mpc-required-permission: offering.read
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: Offering
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Marketplace listings., content: {'application/json': {schema: {$ref: '#/components/schemas/MarketplaceListingsCollection'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/marketplace-installations/{marketplace_installation_id}/listings/{native_listing_key}':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}, {$ref: '#/components/parameters/MarketplaceInstallationId'}, {$ref: '#/components/parameters/NativeListingKey'}]
    get:
      operationId: GetMarketplaceListing
      summary: Get marketplace listing
      x-mpc-operation-class: Q
      x-mpc-required-permission: offering.read
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: Offering
      responses:
        '200': {description: Marketplace listing observation., content: {'application/json': {schema: {$ref: '#/components/schemas/MarketplaceListing'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/listing-intents':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}]
    get:
      operationId: ListListingIntents
      summary: List listing intents
      x-mpc-operation-class: Q
      x-mpc-required-permission: offering.read
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: Offering
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
        - {name: marketplace_installation_id, in: query, required: false, schema: {$ref: '#/components/schemas/OpaqueId'}}
        - {name: lifecycle, in: query, required: false, schema: {type: string, enum: [draft, submitted, discarded]}}
      responses:
        '200': {description: Listing intents., content: {'application/json': {schema: {$ref: '#/components/schemas/ListingIntentsCollection'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: CreateListingIntentDraft
      summary: Create listing intent draft
      x-mpc-operation-class: C
      x-mpc-required-permission: listing.manage
      x-mpc-principal-kinds: [H, A]
      x-mpc-semantic-owner: Offering
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {'application/json': {schema: {$ref: '#/components/schemas/CreateListingIntentDraftRequest'}}}}
      responses:
        '201': {$ref: '#/components/responses/ListingIntentCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/listing-intents/{listing_intent_id}':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}, {$ref: '#/components/parameters/ListingIntentId'}]
    get:
      operationId: GetListingIntent
      summary: Get listing intent
      x-mpc-operation-class: Q
      x-mpc-required-permission: offering.read
      x-mpc-principal-kinds: [H, A, S]
      x-mpc-semantic-owner: Offering
      responses:
        '200': {$ref: '#/components/responses/ListingIntentOk'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: UpdateListingIntentDraft
      summary: Update listing intent draft
      x-mpc-operation-class: C
      x-mpc-required-permission: listing.manage
      x-mpc-principal-kinds: [H, A]
      x-mpc-semantic-owner: Offering
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {'application/json': {schema: {$ref: '#/components/schemas/UpdateListingIntentRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/ListingIntentOk'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/listing-intents/{listing_intent_id}:discard':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}, {$ref: '#/components/parameters/ListingIntentId'}]
    post:
      operationId: DiscardListingIntentDraft
      summary: Discard listing intent draft
      x-mpc-operation-class: C
      x-mpc-required-permission: listing.manage
      x-mpc-principal-kinds: [H, A]
      x-mpc-semantic-owner: Offering
      requestBody: {required: true, content: {'application/json': {schema: {$ref: '#/components/schemas/EtagOnlyRequest'}}}}
      responses:
        '200': {description: Current listing intent and validator., content: {'application/json': {schema: {$ref: '#/components/schemas/ListingIntentMutationResult'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/listing-intents/{listing_intent_id}:submit':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}, {$ref: '#/components/parameters/ListingIntentId'}]
    post:
      operationId: SubmitListingIntent
      summary: Submit listing intent
      x-mpc-operation-class: C
      x-mpc-required-permission: listing.manage
      x-mpc-principal-kinds: [H, A]
      x-mpc-semantic-owner: Offering
      requestBody: {required: true, content: {'application/json': {schema: {$ref: '#/components/schemas/EtagOnlyRequest'}}}}
      responses:
        '200': {description: Current listing intent and validator., content: {'application/json': {schema: {$ref: '#/components/schemas/ListingIntentMutationResult'}}}}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}

  '/organizations/{organization_id}/listing-intents/{listing_intent_id}:create-media':
    parameters: [{$ref: '#/components/parameters/OrganizationId'}, {$ref: '#/components/parameters/ListingIntentId'}]
    post:
      operationId: CreateListingIntentMedia
      summary: Create listing intent authored media
      x-mpc-operation-class: C
      x-mpc-required-permission: listing.manage
      x-mpc-principal-kinds: [H, A]
      x-mpc-semantic-owner: Offering
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/CreateListingIntentMediaMultipart'}
            encoding:
              etag: {contentType: text/plain}
      responses:
        '200': {description: Stable authored-media descriptor and current parent validator., content: {'application/json': {schema: {$ref: '#/components/schemas/CreateListingIntentMediaResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/AuthenticationRequired'}
        '403': {$ref: '#/components/responses/AccessDenied'}
