components:
  securitySchemes:
    MpcBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Accepted external bearer credential; Product authorization remains MPC-owned current authority.

  parameters:
    OrganizationId: {name: organization_id, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueId'}}
    PrincipalId: {name: principal_id, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueId'}}
    MarketplaceInstallationId: {name: marketplace_installation_id, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueId'}}
    NativeListingKey: {name: native_listing_key, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueKey'}}
    ListingIntentId: {name: listing_intent_id, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueId'}}
    PriceIntentId: {name: price_intent_id, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueId'}}
    InventorySourceId: {name: inventory_source_id, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueId'}}
    EconomicAttributionId: {name: economic_attribution_id, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueId'}}
    AuthorizationDecisionId: {name: authorization_decision_id, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueId'}}
    AuthorizationDelegationId: {name: authorization_delegation_id, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueId'}}
    NativeSaleKey: {name: native_sale_key, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueKey'}}
    BusinessOrderIntentId: {name: business_order_intent_id, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueId'}}
    InvoicingIntentId: {name: invoicing_intent_id, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueId'}}
    FulfillmentExecutionId: {name: fulfillment_execution_id, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueId'}}
    FulfillmentNodeId: {name: fulfillment_node_id, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueId'}}
    ArtifactKey: {name: artifact_key, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueKey'}}
    NativeShipmentKey: {name: native_shipment_key, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueKey'}}
    PostSaleResolutionId: {name: post_sale_resolution_id, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueId'}}
    WorkId: {name: work_id, in: path, required: true, schema: {$ref: '#/components/schemas/OpaqueId'}}
    Limit:
      name: limit
      in: query
      required: false
      description: Requested maximum members. The D5 baseline uses 50 by default and rejects values above 100 rather than clamping.
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    Cursor: {name: cursor, in: query, required: false, schema: {type: string, minLength: 1}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {$ref: '#/components/schemas/StrongETag'}}
    MarketplaceInstallationQuery: {name: marketplace_installation_id, in: query, required: true, schema: {$ref: '#/components/schemas/OpaqueId'}}
    SourceInstanceQuery: {name: source_instance_id, in: query, required: true, schema: {$ref: '#/components/schemas/OpaqueId'}}
    NativeProductKeyQuery: {name: native_product_key, in: query, required: true, schema: {$ref: '#/components/schemas/OpaqueKey'}}
    SearchQuery: {name: query, in: query, required: true, schema: {type: string, minLength: 1}}
    MarketSubjectKind: {name: subject_kind, in: query, required: true, schema: {type: string, enum: [existing_listing, source_product_marketplace_context]}}
    EconomicsSubjectKind: {name: subject_kind, in: query, required: true, schema: {type: string, enum: [existing_listing, source_product_marketplace_context]}}
    SubjectMarketplaceInstallationId: {name: marketplace_installation_id, in: query, required: false, schema: {$ref: '#/components/schemas/OpaqueId'}}
    SubjectNativeListingKey: {name: native_listing_key, in: query, required: false, schema: {$ref: '#/components/schemas/OpaqueKey'}}
    SubjectSourceInstanceId: {name: source_instance_id, in: query, required: false, schema: {$ref: '#/components/schemas/OpaqueId'}}
    SubjectNativeProductKey: {name: native_product_key, in: query, required: false, schema: {$ref: '#/components/schemas/OpaqueKey'}}

  headers:
    Location: {description: URI of the created canonical Product resource or occurrence., schema: {type: string, format: uri-reference}}
    ETag: {description: Strong opaque validator for the represented current Product resource., schema: {$ref: '#/components/schemas/StrongETag'}}
    Allow: {description: Current methods allowed for the request target., schema: {type: string, minLength: 1}}

  responses:
    BadRequest: {description: The request is malformed, lacks required idempotency identity, or carries an invalid/expired cursor., content: {'application/problem+json': {schema: {$ref: '#/components/schemas/BadRequestProblemBody'}}}}
    AuthenticationRequired: {description: Authentication is required., content: {'application/problem+json': {schema: {$ref: '#/components/schemas/AuthenticationRequiredProblem'}}}}
    AccessDenied: {description: Current Product access is denied., content: {'application/problem+json': {schema: {$ref: '#/components/schemas/AccessDeniedProblem'}}}}
    ResourceNotFound: {description: Resource is not visible or not found., content: {'application/problem+json': {schema: {$ref: '#/components/schemas/ResourceNotFoundProblem'}}}}
    Conflict: {description: Current revision, state, or idempotent intake conflicts with this request., content: {'application/problem+json': {schema: {$ref: '#/components/schemas/ConflictProblemBody'}}}}
    PreconditionFailed: {description: If-Match does not match the current resource., content: {'application/problem+json': {schema: {$ref: '#/components/schemas/PreconditionFailedProblem'}}}}
    ContentTooLarge: {description: Request body exceeds the enforced bound., content: {'application/problem+json': {schema: {$ref: '#/components/schemas/AboutBlank413Problem'}}}}
    UnsupportedMediaType: {description: Request representation is unsupported., content: {'application/problem+json': {schema: {$ref: '#/components/schemas/AboutBlank415Problem'}}}}
    ValidationError: {description: Request validation failed or an idempotency key was reused for a materially different request., content: {'application/problem+json': {schema: {$ref: '#/components/schemas/UnprocessableProblemBody'}}}}
    PreconditionRequired: {description: If-Match is required., content: {'application/problem+json': {schema: {$ref: '#/components/schemas/PreconditionRequiredProblem'}}}}
    InternalError: {description: Unexpected Product server failure., content: {'application/problem+json': {schema: {$ref: '#/components/schemas/InternalErrorProblem'}}}}
    MethodNotAllowed:
      description: Standard method-not-allowed response.
      headers: {Allow: {$ref: '#/components/headers/Allow'}}
      content: {'application/problem+json': {schema: {$ref: '#/components/schemas/AboutBlank405Problem'}}}
    MarketplaceInstallationOk: {description: Current marketplace installation., headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/MarketplaceInstallation'}}}}
    MarketplaceInstallationCreated: {description: Marketplace installation created., headers: {Location: {$ref: '#/components/headers/Location'}, ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/MarketplaceInstallation'}}}}
    ListingIntentOk: {description: Current listing intent., headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/ListingIntent'}}}}
    ListingIntentCreated: {description: Listing intent created., headers: {Location: {$ref: '#/components/headers/Location'}, ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/ListingIntent'}}}}
    PriceIntentOk: {description: Price intent., headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/PriceIntent'}}}}
    PriceIntentCreated: {description: Price intent created., headers: {Location: {$ref: '#/components/headers/Location'}, ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/PriceIntent'}}}}
    InventorySourceOk: {description: Current inventory source., headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/InventorySource'}}}}
    InventorySourceCreated: {description: Inventory source created., headers: {Location: {$ref: '#/components/headers/Location'}, ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/InventorySource'}}}}
    AvailabilityPolicyOk: {description: Current availability allocation scope policy., headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/AvailabilityAllocationScopePolicy'}}}}
    CommercialPolicyOk: {description: Current commercial policy., headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/CommercialPolicy'}}}}
    EconomicAttributionOk: {description: Current economic attribution., headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/EconomicAttribution'}}}}
    AuthorizationDecisionCreated: {description: Authorization decision created., headers: {Location: {$ref: '#/components/headers/Location'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/AuthorizationDecision'}}}}
    AuthorizationDelegationOk: {description: Current authorization delegation., headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/AuthorizationDelegation'}}}}
    AuthorizationDelegationCreated: {description: Authorization delegation created., headers: {Location: {$ref: '#/components/headers/Location'}, ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/AuthorizationDelegation'}}}}
    MarketplaceSaleOk: {description: Current marketplace sale interpretation., headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/MarketplaceSale'}}}}
    PartyResolutionOk: {description: Current business-system party resolution., headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/PartyResolution'}}}}
    FulfillmentExecutionOk: {description: Current fulfillment execution., headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/FulfillmentExecution'}}}}
    FulfillmentNodeOk: {description: Current fulfillment node., headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/FulfillmentNode'}}}}
    FulfillmentNodeCreated: {description: Fulfillment node created., headers: {Location: {$ref: '#/components/headers/Location'}, ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/FulfillmentNode'}}}}
    FulfillmentOperatingTargetsOk: {description: Current fulfillment operating targets., headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/FulfillmentOperatingTargets'}}}}
    PostSaleResolutionCreated: {description: Post-sale resolution created., headers: {Location: {$ref: '#/components/headers/Location'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/PostSaleResolution'}}}}
    WorkOk: {description: Current work., headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/components/schemas/Work'}}}}

  schemas:
    OpaqueId: {type: string, minLength: 1, description: Opaque MPC-owned identifier with no promised physical encoding.}
    OpaqueKey: {type: string, minLength: 1, description: Opaque source-qualified or owner-local key.}
    StrongETag: {type: string, minLength: 3, description: Strong opaque HTTP entity tag issued by MPC.}
    ExactDecimalString: {type: string, pattern: '^-?[0-9]+(?:\.[0-9]+)?$', description: Exact base-10 value; exponent notation is forbidden.}
    CurrencyCode: {type: string, pattern: '^[A-Z]{3}$'}
    Instant: {type: string, format: date-time}
    Permission:
      type: string
      enum: [access.read, access.manage, portfolio.read, portfolio.manage, readiness.read, readiness.manage, offering.read, listing.manage, price.manage, availability.read, availability.manage, market.read, economics.read, economics.policy.manage, economics.reconcile, governance.read, governance.decide, governance.manage, sales.read, sales.manage, materialization.read, materialization.resolve, fulfillment.read, fulfillment.execute, fulfillment.manage, post_sale.read, post_sale.manage, work.read, work.manage]
    PrincipalKind: {type: string, enum: [human, automation, system]}
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties: {amount: {$ref: '#/components/schemas/ExactDecimalString'}, currency: {$ref: '#/components/schemas/CurrencyCode'}}
    EtagOnlyRequest:
      type: object
      additionalProperties: false
      required: [etag]
      properties: {etag: {$ref: '#/components/schemas/StrongETag'}}

    AccessContext:
      type: object
      additionalProperties: false
      required: [principal_id, principal_kind, organizations]
      properties:
        principal_id: {$ref: '#/components/schemas/OpaqueId'}
        principal_kind: {$ref: '#/components/schemas/PrincipalKind'}
        organizations: {type: array, items: {$ref: '#/components/schemas/OrganizationAccess'}}
    OrganizationAccess:
      type: object
      additionalProperties: false
      required: [organization_id, role_keys, permissions]
      properties:
        organization_id: {$ref: '#/components/schemas/OpaqueId'}
        role_keys: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/OpaqueKey'}}
        permissions: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Permission'}}
    OrganizationMember:
      type: object
      additionalProperties: false
      required: [principal_id, principal_kind, role_keys]
      properties:
        principal_id: {$ref: '#/components/schemas/OpaqueId'}
        principal_kind: {$ref: '#/components/schemas/PrincipalKind'}
        role_keys: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/OpaqueKey'}}
    AccessRole:
      type: object
      additionalProperties: false
      required: [role_key, permissions]
      properties:
        role_key: {$ref: '#/components/schemas/OpaqueKey'}
        display_name: {type: string, minLength: 1}
        permissions: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Permission'}}
    RoleMutationRequest:
      type: object
      additionalProperties: false
      required: [role_key]
      properties: {role_key: {$ref: '#/components/schemas/OpaqueKey'}}
    OrganizationMembersCollection:
      type: object
      additionalProperties: false
      required: [members]
      properties: {members: {type: array, items: {$ref: '#/components/schemas/OrganizationMember'}}, next_cursor: {$ref: '#/components/schemas/OpaqueKey'}}
    AccessRolesCollection:
      type: object
      additionalProperties: false
      required: [access_roles]
      properties: {access_roles: {type: array, items: {$ref: '#/components/schemas/AccessRole'}}, next_cursor: {$ref: '#/components/schemas/OpaqueKey'}}

    MarketplaceInstallation:
      type: object
      additionalProperties: false
      required: [marketplace_installation_id, marketplace_kind, display_name, lifecycle, eligible_selling_entity_ids, created_at, updated_at]
      properties:
        marketplace_installation_id: {$ref: '#/components/schemas/OpaqueId'}
        marketplace_kind: {type: string, enum: [mercado_livre]}
        display_name: {type: string, minLength: 1}
        lifecycle: {type: string, enum: [active, inactive]}
        eligible_selling_entity_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/OpaqueId'}}
        account_posture: {type: string, enum: [bound, authorization_required, unavailable]}
        created_at: {$ref: '#/components/schemas/Instant'}
        updated_at: {$ref: '#/components/schemas/Instant'}
    CreateMarketplaceInstallationRequest:
      type: object
      additionalProperties: false
      required: [marketplace_kind, display_name, eligible_selling_entity_ids]
      properties:
        marketplace_kind: {type: string, enum: [mercado_livre]}
        display_name: {type: string, minLength: 1}
        eligible_selling_entity_ids: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/OpaqueId'}}
    UpdateMarketplaceInstallationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: {type: string, minLength: 1}
        eligible_selling_entity_ids: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/OpaqueId'}}
    MarketplaceInstallationMutationResult:
      type: object
      additionalProperties: false
      required: [marketplace_installation, marketplace_installation_etag]
      properties: {marketplace_installation: {$ref: '#/components/schemas/MarketplaceInstallation'}, marketplace_installation_etag: {$ref: '#/components/schemas/StrongETag'}}
    MarketplaceInstallationsCollection:
      type: object
      additionalProperties: false
      required: [marketplace_installations]
      properties: {marketplace_installations: {type: array, items: {$ref: '#/components/schemas/MarketplaceInstallation'}}, next_cursor: {$ref: '#/components/schemas/OpaqueKey'}}
    SellingEntity:
      type: object
      additionalProperties: false
      required: [selling_entity_id, display_name]
      properties: {selling_entity_id: {$ref: '#/components/schemas/OpaqueId'}, display_name: {type: string, minLength: 1}, legal_name: {type: string, minLength: 1}}
    SellingEntitiesCollection:
      type: object
      additionalProperties: false
      required: [selling_entities]
      properties: {selling_entities: {type: array, items: {$ref: '#/components/schemas/SellingEntity'}}, next_cursor: {$ref: '#/components/schemas/OpaqueKey'}}

    SourceProductRef:
      type: object
      additionalProperties: false
      required: [source_instance_id, native_product_key]
      properties: {source_instance_id: {$ref: '#/components/schemas/OpaqueId'}, native_product_key: {$ref: '#/components/schemas/OpaqueKey'}}
    SourceProductSearchHit:
      type: object
      additionalProperties: false
      required: [source_product, display_name]
      properties:
        source_product: {$ref: '#/components/schemas/SourceProductRef'}
        display_name: {type: string, minLength: 1}
        sku: {type: string, minLength: 1}
        gtin: {type: string, minLength: 1}
        observed_at: {$ref: '#/components/schemas/Instant'}
    SourceProductsSearchCollection:
      type: object
      additionalProperties: false
      required: [source_products, coverage]
      properties:
        source_products: {type: array, items: {$ref: '#/components/schemas/SourceProductSearchHit'}}
        coverage: {type: string, enum: [complete_for_declared_source_scope, partial, unknown, unavailable]}
        next_cursor: {$ref: '#/components/schemas/OpaqueKey'}
    ProductChannelReadinessSubject:
      type: object
      additionalProperties: false
      required: [source_product, marketplace_installation_id]
      properties: {source_product: {$ref: '#/components/schemas/SourceProductRef'}, marketplace_installation_id: {$ref: '#/components/schemas/OpaqueId'}}
    CorrespondenceResolved:
      type: object
      additionalProperties: false
      required: [state, candidate_key]
      properties: {state: {const: resolved}, candidate_key: {$ref: '#/components/schemas/OpaqueKey'}}
    CorrespondenceUnresolved: {type: object, additionalProperties: false, required: [state], properties: {state: {const: unresolved}}}
    CorrespondenceConflicting:
      type: object
      additionalProperties: false
      required: [state, candidate_keys]
      properties: {state: {const: conflicting}, candidate_keys: {type: array, minItems: 2, uniqueItems: true, items: {$ref: '#/components/schemas/OpaqueKey'}}}
    CorrespondenceUnknown: {type: object, additionalProperties: false, required: [state], properties: {state: {const: unknown}}}
    CorrespondenceUnavailable: {type: object, additionalProperties: false, required: [state], properties: {state: {const: unavailable}}}
    ProductChannelCorrespondence:
      oneOf: [{$ref: '#/components/schemas/CorrespondenceResolved'}, {$ref: '#/components/schemas/CorrespondenceUnresolved'}, {$ref: '#/components/schemas/CorrespondenceConflicting'}, {$ref: '#/components/schemas/CorrespondenceUnknown'}, {$ref: '#/components/schemas/CorrespondenceUnavailable'}]
    ProductChannelReadiness:
      type: object
      additionalProperties: false
      required: [subject, correspondence, correspondence_etag, readiness, blockers, evaluated_at]
      properties:
        subject: {$ref: '#/components/schemas/ProductChannelReadinessSubject'}
        correspondence: {$ref: '#/components/schemas/ProductChannelCorrespondence'}
        correspondence_etag: {$ref: '#/components/schemas/StrongETag'}
        readiness: {type: string, enum: [ready, blocked, unknown, unavailable]}
        blockers: {type: array, items: {type: string, minLength: 1}}
        requirements_revision: {$ref: '#/components/schemas/OpaqueKey'}
        evaluated_at: {$ref: '#/components/schemas/Instant'}
    ResolveCorrespondenceRequest:
      type: object
      additionalProperties: false
      required: [subject, correspondence_etag, candidate_key]
      properties: {subject: {$ref: '#/components/schemas/ProductChannelReadinessSubject'}, correspondence_etag: {$ref: '#/components/schemas/StrongETag'}, candidate_key: {$ref: '#/components/schemas/OpaqueKey'}}
    ClearCorrespondenceRequest:
      type: object
      additionalProperties: false
      required: [subject, correspondence_etag]
      properties: {subject: {$ref: '#/components/schemas/ProductChannelReadinessSubject'}, correspondence_etag: {$ref: '#/components/schemas/StrongETag'}}
    PublicationRequirement:
      type: object
      additionalProperties: false
      required: [requirement_key, value_kind, applicability, required, not_applicable_allowed, source_candidates]
      properties:
        requirement_key: {$ref: '#/components/schemas/OpaqueKey'}
        value_kind: {type: string, enum: [text, exact_decimal, boolean, option, text_list, option_list, number_unit, not_applicable]}
        applicability: {type: string, enum: [current, draft_dependent]}
        required: {type: boolean}
        not_applicable_allowed: {type: boolean}
        option_keys: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/OpaqueKey'}}
        unit_keys: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/OpaqueKey'}}
        source_candidates: {type: array, items: {$ref: '#/components/schemas/PublicationSourceCandidate'}}
    PublicationSourceCandidate:
      type: object
      additionalProperties: false
      required: [candidate_key, state]
      properties: {candidate_key: {$ref: '#/components/schemas/OpaqueKey'}, state: {type: string, enum: [known, unknown, unavailable]}, value: {$ref: '#/components/schemas/PublicationValue'}}
    SourceMediaCandidate:
      type: object
      additionalProperties: false
      required: [source_media_candidate_key, content_type]
      properties: {source_media_candidate_key: {$ref: '#/components/schemas/OpaqueKey'}, content_type: {type: string, minLength: 1}}
    PublicationRequirements:
      type: object
      additionalProperties: false
      required: [subject, requirements_revision, requirements, source_media_candidates, evaluated_at]
      properties:
        subject: {$ref: '#/components/schemas/ProductChannelReadinessSubject'}
        requirements_revision: {$ref: '#/components/schemas/OpaqueKey'}
        requirements: {type: array, items: {$ref: '#/components/schemas/PublicationRequirement'}}
        source_media_candidates: {type: array, items: {$ref: '#/components/schemas/SourceMediaCandidate'}}
        evaluated_at: {$ref: '#/components/schemas/Instant'}

    MarketplaceListingRef:
      type: object
      additionalProperties: false
      required: [marketplace_installation_id, native_listing_key]
      properties: {marketplace_installation_id: {$ref: '#/components/schemas/OpaqueId'}, native_listing_key: {$ref: '#/components/schemas/OpaqueKey'}}
    ListingObservedField:
      type: object
      additionalProperties: false
      required: [requirement_key, state]
      properties: {requirement_key: {$ref: '#/components/schemas/OpaqueKey'}, state: {type: string, enum: [known, unknown, unavailable, not_applicable]}, value: {$ref: '#/components/schemas/PublicationValue'}}
    MarketplaceListing:
      type: object
      additionalProperties: false
      required: [listing, lifecycle, observed_fields, observed_at]
      properties:
        listing: {$ref: '#/components/schemas/MarketplaceListingRef'}
        lifecycle: {type: string, enum: [active, paused, closed, unknown]}
        observed_fields: {type: array, items: {$ref: '#/components/schemas/ListingObservedField'}}
        observed_price: {$ref: '#/components/schemas/Money'}
        observed_at: {$ref: '#/components/schemas/Instant'}
    MarketplaceListingListItem:
      type: object
      additionalProperties: false
      required: [listing, lifecycle, observed_at]
      properties: {listing: {$ref: '#/components/schemas/MarketplaceListingRef'}, lifecycle: {type: string, enum: [active, paused, closed, unknown]}, observed_at: {$ref: '#/components/schemas/Instant'}}
    MarketplaceListingsCollection:
      type: object
      additionalProperties: false
      required: [marketplace_listings, coverage]
      properties: {marketplace_listings: {type: array, items: {$ref: '#/components/schemas/MarketplaceListingListItem'}}, coverage: {type: string, enum: [complete_for_declared_source_scope, partial, unknown, unavailable]}, next_cursor: {$ref: '#/components/schemas/OpaqueKey'}}
    ListingIntentNewTarget:
      type: object
      additionalProperties: false
      required: [kind, marketplace_installation_id]
      properties: {kind: {const: new_listing}, marketplace_installation_id: {$ref: '#/components/schemas/OpaqueId'}}
    ListingIntentExistingTarget:
      type: object
      additionalProperties: false
      required: [kind, listing]
      properties: {kind: {const: existing_listing}, listing: {$ref: '#/components/schemas/MarketplaceListingRef'}}
    ListingIntentTarget:
      oneOf: [{$ref: '#/components/schemas/ListingIntentNewTarget'}, {$ref: '#/components/schemas/ListingIntentExistingTarget'}]
    PublicationTextValue: {type: object, additionalProperties: false, required: [kind, value], properties: {kind: {const: text}, value: {type: string}}}
    PublicationExactDecimalValue: {type: object, additionalProperties: false, required: [kind, value], properties: {kind: {const: exact_decimal}, value: {$ref: '#/components/schemas/ExactDecimalString'}}}
    PublicationBooleanValue: {type: object, additionalProperties: false, required: [kind, value], properties: {kind: {const: boolean}, value: {type: boolean}}}
    PublicationOptionValue: {type: object, additionalProperties: false, required: [kind, option_key], properties: {kind: {const: option}, option_key: {$ref: '#/components/schemas/OpaqueKey'}}}
    PublicationTextListValue: {type: object, additionalProperties: false, required: [kind, values], properties: {kind: {const: text_list}, values: {type: array, items: {type: string}}}}
    PublicationOptionListValue: {type: object, additionalProperties: false, required: [kind, option_keys], properties: {kind: {const: option_list}, option_keys: {type: array, items: {$ref: '#/components/schemas/OpaqueKey'}}}}
    PublicationNumberUnitValue: {type: object, additionalProperties: false, required: [kind, value, unit_key], properties: {kind: {const: number_unit}, value: {$ref: '#/components/schemas/ExactDecimalString'}, unit_key: {$ref: '#/components/schemas/OpaqueKey'}}}
    PublicationNotApplicableValue: {type: object, additionalProperties: false, required: [kind], properties: {kind: {const: not_applicable}}}
    PublicationValue:
      oneOf: [{$ref: '#/components/schemas/PublicationTextValue'}, {$ref: '#/components/schemas/PublicationExactDecimalValue'}, {$ref: '#/components/schemas/PublicationBooleanValue'}, {$ref: '#/components/schemas/PublicationOptionValue'}, {$ref: '#/components/schemas/PublicationTextListValue'}, {$ref: '#/components/schemas/PublicationOptionListValue'}, {$ref: '#/components/schemas/PublicationNumberUnitValue'}, {$ref: '#/components/schemas/PublicationNotApplicableValue'}]
    FollowSourceResolution: {type: object, additionalProperties: false, required: [kind, requirement_key, source_candidate_key], properties: {kind: {const: follow_source}, requirement_key: {$ref: '#/components/schemas/OpaqueKey'}, source_candidate_key: {$ref: '#/components/schemas/OpaqueKey'}}}
    ExplicitOverrideResolution: {type: object, additionalProperties: false, required: [kind, requirement_key, value], properties: {kind: {const: explicit_override}, requirement_key: {$ref: '#/components/schemas/OpaqueKey'}, value: {$ref: '#/components/schemas/PublicationValue'}}}
    RequirementResolution: {oneOf: [{$ref: '#/components/schemas/FollowSourceResolution'}, {$ref: '#/components/schemas/ExplicitOverrideResolution'}]}
    SourceMediaSelection: {type: object, additionalProperties: false, required: [kind, source_media_candidate_key], properties: {kind: {const: source_media}, source_media_candidate_key: {$ref: '#/components/schemas/OpaqueKey'}}}
    AuthoredMediaSelection: {type: object, additionalProperties: false, required: [kind, listing_intent_media_id], properties: {kind: {const: authored_media}, listing_intent_media_id: {$ref: '#/components/schemas/OpaqueId'}}}
    MediaSelection: {oneOf: [{$ref: '#/components/schemas/SourceMediaSelection'}, {$ref: '#/components/schemas/AuthoredMediaSelection'}]}
    ListingIntentDesired:
      type: object
      additionalProperties: false
      required: [lifecycle, requirement_resolutions, media_selection]
