components:
  securitySchemes:
    MpcBearerAuth:
      type: http
      scheme: bearer
  parameters:
    organization_id: { name: organization_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    principal_id: { name: principal_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    role_key: { name: role_key, in: path, required: true, schema: { type: string, minLength: 1 } }
    marketplace_installation_id: { name: marketplace_installation_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    native_listing_key: { name: native_listing_key, in: path, required: true, schema: { type: string, minLength: 1 } }
    listing_intent_id: { name: listing_intent_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    price_intent_id: { name: price_intent_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    inventory_source_id: { name: inventory_source_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    economic_attribution_id: { name: economic_attribution_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    authorization_decision_id: { name: authorization_decision_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    authorization_delegation_id: { name: authorization_delegation_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    native_sale_key: { name: native_sale_key, in: path, required: true, schema: { type: string, minLength: 1 } }
    business_order_intent_id: { name: business_order_intent_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    invoicing_intent_id: { name: invoicing_intent_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    fulfillment_execution_id: { name: fulfillment_execution_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    fulfillment_node_id: { name: fulfillment_node_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    artifact_key: { name: artifact_key, in: path, required: true, schema: { type: string, minLength: 1 } }
    native_shipment_key: { name: native_shipment_key, in: path, required: true, schema: { type: string, minLength: 1 } }
    post_sale_resolution_id: { name: post_sale_resolution_id, in: path, required: true, schema: { type: string, minLength: 1 } }
    work_id: { name: work_id, in: path, required: true, schema: { type: string, minLength: 1 } }
  schemas:
    ProductProblem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
  responses:
    Ok:
      description: Successful Product owner response. Typed W2/W3 response body is authored in the same D5 gate before acceptance.
    Created:
      description: Canonical MPC resource or occurrence created. Typed W2 response and Location are authored in the same D5 gate before acceptance.
    ProductProblem:
      description: RFC 9457 Product Problem Details. Exact canonical Product problem constants are authored in the same D5 gate before acceptance.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProductProblem' }
