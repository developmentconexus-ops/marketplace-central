components:
  securitySchemes:
    MpcHumanSessionAuth:
      type: apiKey
      in: cookie
      name: __Host-mpc_session
      description: >-
        Opaque server-side application-session handle for the interactive human Principal.
        External OIDC/OAuth tokens stay server-side; Product authorization remains MPC-owned current authority.
    MpcMachineBearerAuth:
      type: http
      scheme: bearer
      description: >-
        Audience-bound external OAuth access token issued to a confidential machine client through
        Client Credentials and resolved fail-closed to one automation/system Principal. Product
        authorization remains MPC-owned current authority.
