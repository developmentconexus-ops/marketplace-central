openapi: 3.1.2
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Marketplace Central Product API
  version: 1.0.0-d5
  description: >-
    Canonical Product API wire description derived from the accepted D5 Product contract.
    This document defines Product wire shape only. Active runtime is NONE and implementation
    remains blocked until D9.
security:
  - MpcHumanSessionAuth: []
  - MpcMachineBearerAuth: []

x-mpc-authentication-profile:
  human:
    principal_kind: H
    security_scheme: MpcHumanSessionAuth
    oidc_flow: authorization_code_server_side
    browser_oidc_token_exposure: none
    session_cookie:
      name: __Host-mpc_session
      secure: true
      http_only: true
      same_site: lax
      path: /
      domain: absent
    csrf:
      carrier: header
      name: X-CSRF-Token
      required_on_methods: [DELETE, PATCH, POST, PUT]
  machine:
    principal_kinds: [A, S]
    security_scheme: MpcMachineBearerAuth
    grant: client_credentials

