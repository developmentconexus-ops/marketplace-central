parameters:
  OrganizationId: {name: organization_id, in: path, required: true, schema: {$ref: '#/schemas/OpaqueId'}}
  PrincipalId: {name: principal_id, in: path, required: true, schema: {$ref: '#/schemas/OpaqueId'}}
  MarketplaceInstallationId: {name: marketplace_installation_id, in: path, required: true, schema: {$ref: '#/schemas/OpaqueId'}}
  NativeListingKey: {name: native_listing_key, in: path, required: true, schema: {$ref: '#/schemas/OpaqueKey'}}
  ListingIntentId: {name: listing_intent_id, in: path, required: true, schema: {$ref: '#/schemas/OpaqueId'}}
  PriceIntentId: {name: price_intent_id, in: path, required: true, schema: {$ref: '#/schemas/OpaqueId'}}
  InventorySourceId: {name: inventory_source_id, in: path, required: true, schema: {$ref: '#/schemas/OpaqueId'}}
  EconomicAttributionId: {name: economic_attribution_id, in: path, required: true, schema: {$ref: '#/schemas/OpaqueId'}}
  AuthorizationDecisionId: {name: authorization_decision_id, in: path, required: true, schema: {$ref: '#/schemas/OpaqueId'}}
  AuthorizationDelegationId: {name: authorization_delegation_id, in: path, required: true, schema: {$ref: '#/schemas/OpaqueId'}}
  NativeSaleKey: {name: native_sale_key, in: path, required: true, schema: {$ref: '#/schemas/OpaqueKey'}}
  BusinessOrderIntentId: {name: business_order_intent_id, in: path, required: true, schema: {$ref: '#/schemas/OpaqueId'}}
  InvoicingIntentId: {name: invoicing_intent_id, in: path, required: true, schema: {$ref: '#/schemas/OpaqueId'}}
  FulfillmentExecutionId: {name: fulfillment_execution_id, in: path, required: true, schema: {$ref: '#/schemas/OpaqueId'}}
  FulfillmentNodeId: {name: fulfillment_node_id, in: path, required: true, schema: {$ref: '#/schemas/OpaqueId'}}
  ArtifactKey: {name: artifact_key, in: path, required: true, schema: {$ref: '#/schemas/OpaqueKey'}}
  NativeShipmentKey: {name: native_shipment_key, in: path, required: true, schema: {$ref: '#/schemas/OpaqueKey'}}
  PostSaleResolutionId: {name: post_sale_resolution_id, in: path, required: true, schema: {$ref: '#/schemas/OpaqueId'}}
  WorkId: {name: work_id, in: path, required: true, schema: {$ref: '#/schemas/OpaqueId'}}
  Limit:
    name: limit
    in: query
    required: false
    description: Requested maximum members; values above the explicit maximum are rejected rather than clamped.
    schema: {type: integer, minimum: 1, maximum: 100, default: 50}
  Cursor: {name: cursor, in: query, required: false, schema: {type: string, minLength: 1}}
  IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1}}
  IfMatch: {name: If-Match, in: header, required: true, schema: {$ref: '#/schemas/StrongETag'}}
  MarketplaceInstallationQuery: {name: marketplace_installation_id, in: query, required: true, schema: {$ref: '#/schemas/OpaqueId'}}
  SourceInstanceQuery: {name: source_instance_id, in: query, required: true, schema: {$ref: '#/schemas/OpaqueId'}}
  NativeProductKeyQuery: {name: native_product_key, in: query, required: true, schema: {$ref: '#/schemas/OpaqueKey'}}
  SearchQuery: {name: query, in: query, required: true, schema: {type: string, minLength: 1}}
  MarketSubjectKind: {name: subject_kind, in: query, required: true, schema: {type: string, enum: [existing_listing, source_product_marketplace_context]}}
  EconomicsSubjectKind: {name: subject_kind, in: query, required: true, schema: {type: string, enum: [existing_listing, source_product_marketplace_context]}}
  SubjectMarketplaceInstallationId: {name: marketplace_installation_id, in: query, required: false, schema: {$ref: '#/schemas/OpaqueId'}}
  SubjectNativeListingKey: {name: native_listing_key, in: query, required: false, schema: {$ref: '#/schemas/OpaqueKey'}}
  SubjectSourceInstanceId: {name: source_instance_id, in: query, required: false, schema: {$ref: '#/schemas/OpaqueId'}}
  SubjectNativeProductKey: {name: native_product_key, in: query, required: false, schema: {$ref: '#/schemas/OpaqueKey'}}

headers:
  Location: {description: URI of the created canonical Product resource or occurrence., schema: {type: string, format: uri-reference}}
  ETag: {description: Strong opaque validator for the represented current Product resource., schema: {$ref: '#/schemas/StrongETag'}}
  Allow: {description: Current methods allowed for the request target., schema: {type: string, minLength: 1}}

responses:
  BadRequest: {description: "Malformed request, missing required idempotency identity, or invalid/expired cursor.", content: {'application/problem+json': {schema: {$ref: '#/schemas/BadRequestProblemBody'}}}}
  AuthenticationRequired: {description: Authentication is required., content: {'application/problem+json': {schema: {$ref: '#/schemas/AuthenticationRequiredProblem'}}}}
  AccessDenied: {description: Current Product access is denied., content: {'application/problem+json': {schema: {$ref: '#/schemas/AccessDeniedProblem'}}}}
  ResourceNotFound: {description: Resource is not visible or not found., content: {'application/problem+json': {schema: {$ref: '#/schemas/ResourceNotFoundProblem'}}}}
  Conflict: {description: "Current revision, state, or idempotent intake conflicts with this request.", content: {'application/problem+json': {schema: {$ref: '#/schemas/ConflictProblemBody'}}}}
  PreconditionFailed: {description: If-Match does not match the current resource., content: {'application/problem+json': {schema: {$ref: '#/schemas/PreconditionFailedProblem'}}}}
  ContentTooLarge: {description: Request body exceeds the enforced bound., content: {'application/problem+json': {schema: {$ref: '#/schemas/AboutBlank413Problem'}}}}
  UnsupportedMediaType: {description: Request representation is unsupported., content: {'application/problem+json': {schema: {$ref: '#/schemas/AboutBlank415Problem'}}}}
  ValidationError: {description: Request validation failed or an idempotency key was reused for a materially different request., content: {'application/problem+json': {schema: {$ref: '#/schemas/UnprocessableProblemBody'}}}}
  PreconditionRequired: {description: If-Match is required., content: {'application/problem+json': {schema: {$ref: '#/schemas/PreconditionRequiredProblem'}}}}
  InternalError: {description: Unexpected Product server failure., content: {'application/problem+json': {schema: {$ref: '#/schemas/InternalErrorProblem'}}}}
  MethodNotAllowed:
    description: Standard method-not-allowed response.
    headers: {Allow: {$ref: '#/headers/Allow'}}
    content: {'application/problem+json': {schema: {$ref: '#/schemas/AboutBlank405Problem'}}}

  MarketplaceInstallationOk: {description: Current marketplace installation., headers: {ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/MarketplaceInstallation'}}}}
  MarketplaceInstallationCreated: {description: Marketplace installation created., headers: {Location: {$ref: '#/headers/Location'}, ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/MarketplaceInstallation'}}}}
  ListingIntentOk: {description: Current listing intent., headers: {ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/ListingIntent'}}}}
  ListingIntentCreated: {description: Listing intent created., headers: {Location: {$ref: '#/headers/Location'}, ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/ListingIntent'}}}}
  PriceIntentOk: {description: Current price intent., headers: {ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/PriceIntent'}}}}
  PriceIntentCreated: {description: Price intent created., headers: {Location: {$ref: '#/headers/Location'}, ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/PriceIntent'}}}}
  InventorySourceOk: {description: Current inventory source., headers: {ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/InventorySource'}}}}
  InventorySourceCreated: {description: Inventory source created., headers: {Location: {$ref: '#/headers/Location'}, ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/InventorySource'}}}}
  AvailabilityPolicyOk: {description: Current availability allocation scope policy., headers: {ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/AvailabilityAllocationScopePolicy'}}}}
  CommercialPolicyOk: {description: Current commercial policy., headers: {ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/CommercialPolicy'}}}}
  EconomicAttributionOk: {description: Current economic attribution., headers: {ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/EconomicAttribution'}}}}
  AuthorizationDecisionCreated: {description: Authorization decision created., headers: {Location: {$ref: '#/headers/Location'}}, content: {'application/json': {schema: {$ref: '#/schemas/AuthorizationDecision'}}}}
  AuthorizationDelegationOk: {description: Current authorization delegation., headers: {ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/AuthorizationDelegation'}}}}
  AuthorizationDelegationCreated: {description: Authorization delegation created., headers: {Location: {$ref: '#/headers/Location'}, ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/AuthorizationDelegation'}}}}
  MarketplaceSaleOk: {description: Current marketplace sale interpretation., headers: {ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/MarketplaceSale'}}}}
  PartyResolutionOk: {description: Current business-system party resolution., headers: {ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/PartyResolution'}}}}
  FulfillmentExecutionOk: {description: Current fulfillment execution., headers: {ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/FulfillmentExecution'}}}}
  FulfillmentNodeOk: {description: Current fulfillment node., headers: {ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/FulfillmentNode'}}}}
  FulfillmentNodeCreated: {description: Fulfillment node created., headers: {Location: {$ref: '#/headers/Location'}, ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/FulfillmentNode'}}}}
  FulfillmentOperatingTargetsOk: {description: Current fulfillment operating targets., headers: {ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/FulfillmentOperatingTargets'}}}}
  PostSaleResolutionCreated: {description: Post-sale resolution created., headers: {Location: {$ref: '#/headers/Location'}}, content: {'application/json': {schema: {$ref: '#/schemas/PostSaleResolution'}}}}
  WorkOk: {description: Current operational work., headers: {ETag: {$ref: '#/headers/ETag'}}, content: {'application/json': {schema: {$ref: '#/schemas/Work'}}}}

schemas:
  OpaqueId: {type: string, minLength: 1, description: Opaque MPC-owned identifier with no promised physical encoding.}
  OpaqueKey: {type: string, minLength: 1, description: Opaque source-qualified or owner-local key.}
  StrongETag: {type: string, pattern: '^"[\u0021\u0023-\u007E\u0080-\u00FF]*"$', description: Strong opaque HTTP entity tag issued by MPC; weak validators are not accepted.}
  ExactDecimalString: {type: string, pattern: '^-?[0-9]+(?:\.[0-9]+)?$', description: Exact base-10 value; exponent notation is forbidden.}
  NonNegativeExactDecimalString: {type: string, pattern: '^[0-9]+(?:\.[0-9]+)?$', description: Exact non-negative base-10 value; exponent notation is forbidden.}
  CurrencyCode: {type: string, pattern: '^[A-Z]{3}$'}
  Instant: {type: string, format: date-time}
  DurationString: {type: string, format: duration}
  Permission:
    type: string
    enum: [access.read, access.manage, portfolio.read, portfolio.manage, readiness.read, readiness.manage, offering.read, listing.manage, price.manage, availability.read, availability.manage, market.read, economics.read, economics.policy.manage, economics.reconcile, governance.read, governance.decide, governance.manage, sales.read, sales.manage, materialization.read, materialization.resolve, fulfillment.read, fulfillment.execute, fulfillment.manage, post_sale.read, post_sale.manage, work.read, work.manage]
  PrincipalKind: {type: string, enum: [human, automation, system]}
  Money:
    type: object
    additionalProperties: false
    required: [amount, currency]
    properties: {amount: {$ref: '#/schemas/ExactDecimalString'}, currency: {$ref: '#/schemas/CurrencyCode'}}
  EtagOnlyRequest:
    type: object
    additionalProperties: false
    required: [etag]
    properties: {etag: {$ref: '#/schemas/StrongETag'}}

  AccessContext:
    type: object
    additionalProperties: false
    required: [principal_id, principal_kind, organizations]
    properties:
      principal_id: {$ref: '#/schemas/OpaqueId'}
      principal_kind: {$ref: '#/schemas/PrincipalKind'}
      organizations: {type: array, items: {$ref: '#/schemas/OrganizationAccess'}}
  OrganizationAccess:
    type: object
    additionalProperties: false
    required: [organization_id, role_keys, permissions]
    properties:
      organization_id: {$ref: '#/schemas/OpaqueId'}
      role_keys: {type: array, uniqueItems: true, items: {$ref: '#/schemas/OpaqueKey'}}
      permissions: {type: array, uniqueItems: true, items: {$ref: '#/schemas/Permission'}}
  OrganizationMember:
    type: object
    additionalProperties: false
    required: [principal_id, principal_kind, role_keys]
    properties:
      principal_id: {$ref: '#/schemas/OpaqueId'}
      principal_kind: {$ref: '#/schemas/PrincipalKind'}
      role_keys: {type: array, uniqueItems: true, items: {$ref: '#/schemas/OpaqueKey'}}
  AccessRole:
    type: object
    additionalProperties: false
    required: [role_key, permissions]
    properties:
      role_key: {$ref: '#/schemas/OpaqueKey'}
      display_name: {type: string, minLength: 1}
      permissions: {type: array, uniqueItems: true, items: {$ref: '#/schemas/Permission'}}
  RoleMutationRequest:
    type: object
    additionalProperties: false
    required: [role_key]
    properties: {role_key: {$ref: '#/schemas/OpaqueKey'}}
  OrganizationMembersCollection: {$ref: '#/schemas/OrganizationMemberCollectionBase'}
  OrganizationMemberCollectionBase:
    type: object
    additionalProperties: false
    required: [members]
    properties: {members: {type: array, items: {$ref: '#/schemas/OrganizationMember'}}, next_cursor: {$ref: '#/schemas/OpaqueKey'}}
  AccessRolesCollection:
    type: object
    additionalProperties: false
    required: [access_roles]
    properties: {access_roles: {type: array, items: {$ref: '#/schemas/AccessRole'}}, next_cursor: {$ref: '#/schemas/OpaqueKey'}}

  MarketplaceInstallation:
    type: object
    additionalProperties: false
    required: [marketplace_installation_id, marketplace_kind, display_name, lifecycle, eligible_selling_entity_ids, created_at, updated_at]
    properties:
      marketplace_installation_id: {$ref: '#/schemas/OpaqueId'}
      marketplace_kind: {type: string, enum: [mercado_livre]}
      display_name: {type: string, minLength: 1}
      lifecycle: {type: string, enum: [active, inactive]}
      eligible_selling_entity_ids: {type: array, uniqueItems: true, items: {$ref: '#/schemas/OpaqueId'}}
      account_posture: {type: string, enum: [bound, authorization_required, unavailable]}
      created_at: {$ref: '#/schemas/Instant'}
      updated_at: {$ref: '#/schemas/Instant'}
  CreateMarketplaceInstallationRequest:
    type: object
    additionalProperties: false
    required: [marketplace_kind, display_name, eligible_selling_entity_ids]
    properties:
      marketplace_kind: {type: string, enum: [mercado_livre]}
      display_name: {type: string, minLength: 1}
      eligible_selling_entity_ids: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/schemas/OpaqueId'}}
  UpdateMarketplaceInstallationRequest:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      display_name: {type: string, minLength: 1}
      eligible_selling_entity_ids: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/schemas/OpaqueId'}}
  MarketplaceInstallationMutationResult:
    type: object
    additionalProperties: false
    required: [marketplace_installation, marketplace_installation_etag]
    properties: {marketplace_installation: {$ref: '#/schemas/MarketplaceInstallation'}, marketplace_installation_etag: {$ref: '#/schemas/StrongETag'}}
  MarketplaceInstallationsCollection:
    type: object
    additionalProperties: false
    required: [marketplace_installations]
    properties: {marketplace_installations: {type: array, items: {$ref: '#/schemas/MarketplaceInstallation'}}, next_cursor: {$ref: '#/schemas/OpaqueKey'}}
  SellingEntity:
    type: object
    additionalProperties: false
    required: [selling_entity_id, display_name]
    properties: {selling_entity_id: {$ref: '#/schemas/OpaqueId'}, display_name: {type: string, minLength: 1}, legal_name: {type: string, minLength: 1}}
  SellingEntitiesCollection:
    type: object
    additionalProperties: false
    required: [selling_entities]
    properties: {selling_entities: {type: array, items: {$ref: '#/schemas/SellingEntity'}}, next_cursor: {$ref: '#/schemas/OpaqueKey'}}

  SourceProductRef:
    type: object
    additionalProperties: false
    required: [source_instance_id, native_product_key]
    properties: {source_instance_id: {$ref: '#/schemas/OpaqueId'}, native_product_key: {$ref: '#/schemas/OpaqueKey'}}
  SourceProductPresentationKnown:
    type: object
    additionalProperties: false
    required: [state, display_name, source_instance_display_name]
    properties:
      state: {const: known}
      display_name: {type: string, minLength: 1}
      source_instance_display_name: {type: string, minLength: 1}
      sku: {type: string}
      gtin: {type: string}
      observed_at: {$ref: '#/schemas/Instant'}
  SourceProductPresentationUnknown:
    type: object
    additionalProperties: false
    required: [state]
    properties: {state: {const: unknown}}
  SourceProductPresentationUnavailable:
    type: object
    additionalProperties: false
    required: [state]
    properties: {state: {const: unavailable}}
  SourceProductPresentation:
    oneOf:
      - {$ref: '#/schemas/SourceProductPresentationKnown'}
      - {$ref: '#/schemas/SourceProductPresentationUnknown'}
      - {$ref: '#/schemas/SourceProductPresentationUnavailable'}
  SourceProductSearchHit:
    type: object
    additionalProperties: false
    required: [source_product, presentation]
    properties:
      source_product: {$ref: '#/schemas/SourceProductRef'}
      presentation: {$ref: '#/schemas/SourceProductPresentationKnown'}
  SourceProductsSearchCollection:
    type: object
    additionalProperties: false
    required: [source_products, coverage]
    properties: {source_products: {type: array, items: {$ref: '#/schemas/SourceProductSearchHit'}}, coverage: {type: string, enum: [complete_for_declared_source_scope, partial, unknown, unavailable]}, next_cursor: {$ref: '#/schemas/OpaqueKey'}}
  ProductChannelReadinessSubject:
    type: object
    additionalProperties: false
    required: [source_product, marketplace_installation_id]
    properties: {source_product: {$ref: '#/schemas/SourceProductRef'}, marketplace_installation_id: {$ref: '#/schemas/OpaqueId'}}
  CorrespondenceResolved:
    type: object
    additionalProperties: false
    required: [state, candidate_key]
    properties: {state: {const: resolved}, candidate_key: {$ref: '#/schemas/OpaqueKey'}}
  CorrespondenceUnresolved: {type: object, additionalProperties: false, required: [state], properties: {state: {const: unresolved}}}
  CorrespondenceConflicting:
    type: object
    additionalProperties: false
    required: [state, candidate_keys]
    properties: {state: {const: conflicting}, candidate_keys: {type: array, minItems: 2, uniqueItems: true, items: {$ref: '#/schemas/OpaqueKey'}}}
  CorrespondenceUnknown: {type: object, additionalProperties: false, required: [state], properties: {state: {const: unknown}}}
  CorrespondenceUnavailable: {type: object, additionalProperties: false, required: [state], properties: {state: {const: unavailable}}}
  ProductChannelCorrespondence:
    oneOf: [{$ref: '#/schemas/CorrespondenceResolved'}, {$ref: '#/schemas/CorrespondenceUnresolved'}, {$ref: '#/schemas/CorrespondenceConflicting'}, {$ref: '#/schemas/CorrespondenceUnknown'}, {$ref: '#/schemas/CorrespondenceUnavailable'}]
  ProductChannelCorrespondenceCandidate:
    type: object
    additionalProperties: false
    required: [candidate_key, display_label]
    properties:
      candidate_key: {$ref: '#/schemas/OpaqueKey'}
      display_label: {type: string, minLength: 1}
  CorrespondenceCandidatePopulationKnown:
    type: object
    additionalProperties: false
    required: [state, candidates]
    properties:
      state: {const: known}
      candidates:
        type: array
        items: {$ref: '#/schemas/ProductChannelCorrespondenceCandidate'}
  CorrespondenceCandidatePopulationUnknown:
    type: object
    additionalProperties: false
    required: [state]
    properties: {state: {const: unknown}}
  CorrespondenceCandidatePopulationUnavailable:
    type: object
    additionalProperties: false
    required: [state]
    properties: {state: {const: unavailable}}
  CorrespondenceCandidatePopulation:
    oneOf:
      - {$ref: '#/schemas/CorrespondenceCandidatePopulationKnown'}
      - {$ref: '#/schemas/CorrespondenceCandidatePopulationUnknown'}
      - {$ref: '#/schemas/CorrespondenceCandidatePopulationUnavailable'}
  ProductChannelReadiness:
    type: object
    additionalProperties: false
    required: [subject, subject_presentation, correspondence, correspondence_candidate_population, correspondence_etag, readiness, blockers, evaluated_at]
    properties:
      subject: {$ref: '#/schemas/ProductChannelReadinessSubject'}
      subject_presentation: {$ref: '#/schemas/SourceProductPresentation'}
      correspondence: {$ref: '#/schemas/ProductChannelCorrespondence'}
      correspondence_candidate_population: {$ref: '#/schemas/CorrespondenceCandidatePopulation'}
      correspondence_etag: {$ref: '#/schemas/StrongETag'}
      readiness: {type: string, enum: [ready, blocked, unknown, unavailable]}
      blockers: {type: array, items: {type: string}}
      requirements_revision: {$ref: '#/schemas/OpaqueKey'}
      evaluated_at: {$ref: '#/schemas/Instant'}
  ResolveCorrespondenceRequest:
    type: object
    additionalProperties: false
    required: [subject, correspondence_etag, candidate_key]
    properties: {subject: {$ref: '#/schemas/ProductChannelReadinessSubject'}, correspondence_etag: {$ref: '#/schemas/StrongETag'}, candidate_key: {$ref: '#/schemas/OpaqueKey'}}
  ClearCorrespondenceRequest:
    type: object
    additionalProperties: false
    required: [subject, correspondence_etag]
    properties: {subject: {$ref: '#/schemas/ProductChannelReadinessSubject'}, correspondence_etag: {$ref: '#/schemas/StrongETag'}}
  PublicationTextValue: {type: object, additionalProperties: false, required: [kind, value], properties: {kind: {const: text}, value: {type: string}}}
  PublicationExactDecimalValue: {type: object, additionalProperties: false, required: [kind, value], properties: {kind: {const: exact_decimal}, value: {$ref: '#/schemas/ExactDecimalString'}}}
  PublicationBooleanValue: {type: object, additionalProperties: false, required: [kind, value], properties: {kind: {const: boolean}, value: {type: boolean}}}
  PublicationOptionValue: {type: object, additionalProperties: false, required: [kind, option_key], properties: {kind: {const: option}, option_key: {$ref: '#/schemas/OpaqueKey'}}}
  PublicationTextListValue: {type: object, additionalProperties: false, required: [kind, values], properties: {kind: {const: text_list}, values: {type: array, items: {type: string}}}}
  PublicationOptionListValue: {type: object, additionalProperties: false, required: [kind, option_keys], properties: {kind: {const: option_list}, option_keys: {type: array, items: {$ref: '#/schemas/OpaqueKey'}}}}
  PublicationNumberUnitValue: {type: object, additionalProperties: false, required: [kind, value, unit_key], properties: {kind: {const: number_unit}, value: {$ref: '#/schemas/ExactDecimalString'}, unit_key: {$ref: '#/schemas/OpaqueKey'}}}
  PublicationNotApplicableValue: {type: object, additionalProperties: false, required: [kind], properties: {kind: {const: not_applicable}}}
  PublicationValue:
    oneOf: [{$ref: '#/schemas/PublicationTextValue'}, {$ref: '#/schemas/PublicationExactDecimalValue'}, {$ref: '#/schemas/PublicationBooleanValue'}, {$ref: '#/schemas/PublicationOptionValue'}, {$ref: '#/schemas/PublicationTextListValue'}, {$ref: '#/schemas/PublicationOptionListValue'}, {$ref: '#/schemas/PublicationNumberUnitValue'}, {$ref: '#/schemas/PublicationNotApplicableValue'}]
  PublicationOptionValueView:
    type: object
    additionalProperties: false
    required: [kind, option_key, display_name]
    properties:
      kind: {const: option}
      option_key: {$ref: '#/schemas/OpaqueKey'}
      display_name: {type: string, minLength: 1}
  PublicationOptionListValueView:
    type: object
    additionalProperties: false
    required: [kind, options]
    properties:
      kind: {const: option_list}
      options:
        type: array
        items: {$ref: '#/schemas/PublicationOptionDescriptor'}
  PublicationNumberUnitValueView:
    type: object
    additionalProperties: false
    required: [kind, value, unit_key, unit_display_name]
    properties:
      kind: {const: number_unit}
      value: {$ref: '#/schemas/ExactDecimalString'}
      unit_key: {$ref: '#/schemas/OpaqueKey'}
      unit_display_name: {type: string, minLength: 1}
  PublicationValueView:
    oneOf:
      - {$ref: '#/schemas/PublicationTextValue'}
      - {$ref: '#/schemas/PublicationExactDecimalValue'}
      - {$ref: '#/schemas/PublicationBooleanValue'}
      - {$ref: '#/schemas/PublicationOptionValueView'}
      - {$ref: '#/schemas/PublicationTextListValue'}
      - {$ref: '#/schemas/PublicationOptionListValueView'}
      - {$ref: '#/schemas/PublicationNumberUnitValueView'}
      - {$ref: '#/schemas/PublicationNotApplicableValue'}
  PublicationContextRef:
    type: object
    additionalProperties: false
    properties:
      category_key: {$ref: '#/schemas/OpaqueKey'}
      product_type_key: {$ref: '#/schemas/OpaqueKey'}
  PublicationCategoryDescriptor:
    type: object
    additionalProperties: false
    required: [category_key, display_name]
    properties:
      category_key: {$ref: '#/schemas/OpaqueKey'}
      display_name: {type: string, minLength: 1}
  PublicationProductTypeDescriptor:
    type: object
    additionalProperties: false
