        are identity warnings; the remaining values surface product-existence and
        per-source gaps propagated from the internal reader.
      enum:
        - complete
        - missing_product
        - ambiguous_product
        - missing_stock
        - missing_price
        - missing_cost
        - ambiguous_price
        - missing_tax
        - stale_source
        - invalid_ean
        - ean_collision
