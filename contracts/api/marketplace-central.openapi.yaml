openapi: 3.1.0
info:
  title: Marketplace Central API
  version: 2026-07-13
paths:
  /mutations:
    post:
      summary: Create a mutation protocol
      operationId: createMutation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMutationRequest'
      responses:
        "201":
          description: Mutation protocol created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationProtocol'
        "400":
          description: invalid_body, invalid_intent, or installation_required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "405":
          description: method_not_allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "422":
          description: actor_required, type_not_enabled, empty_selection, selection_too_large, or source_time_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
    get:
      summary: List mutation protocols
      description: Protocols are ordered by created_at descending, with protocol_id descending as the tiebreaker. The cursor is opaque to clients.
      operationId: listMutations
      parameters:
        - name: installation_id
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MutationState'
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MutationType'
          description: Query filtering accepts enabled protocol types; reserved listing_create is rejected as invalid_filter.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque base64 cursor returned by the previous page; its internal structure is not part of the API.
      responses:
        "200":
          description: Mutation protocols ordered by created_at DESC, then protocol_id DESC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationProtocolPage'
        "400":
          description: installation_required, invalid_filter, or invalid_cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "405":
          description: method_not_allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
  /mutations/{id}/preview:
    post:
      summary: Preview a mutation protocol
      operationId: previewMutation
      parameters:
        - $ref: '#/components/parameters/MutationProtocolId'
      responses:
        "200":
          description: Mutation preview created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationPreview'
        "400":
          description: invalid_body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "404":
          description: protocol_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "405":
          description: method_not_allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "409":
          description: invalid_state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "422":
          description: actor_required, empty_selection, selection_too_large, or source_time_unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
  /mutations/{id}/approve:
    post:
      summary: Approve a mutation protocol for execution
      operationId: approveMutation
      parameters:
        - $ref: '#/components/parameters/MutationProtocolId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveMutationRequest'
      responses:
        "200":
          description: Mutation protocol approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationProtocol'
        "400":
          description: invalid_body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "404":
          description: protocol_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "405":
          description: method_not_allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "409":
          description: preview_stale or invalid_state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "422":
          description: execute_required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
  /mutations/{id}/cancel:
    post:
      summary: Cancel a mutation protocol
      operationId: cancelMutation
      parameters:
        - $ref: '#/components/parameters/MutationProtocolId'
      responses:
        "200":
          description: Mutation protocol cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationProtocol'
        "400":
          description: invalid_body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "404":
          description: protocol_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "405":
          description: method_not_allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "409":
          description: invalid_state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
  /mutations/{id}/retry:
    post:
      summary: Retry failed mutation items in a new protocol
      operationId: retryMutationFailures
      parameters:
        - $ref: '#/components/parameters/MutationProtocolId'
      responses:
        "200":
          description: Retry mutation protocol created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationProtocol'
        "400":
          description: invalid_body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "404":
          description: protocol_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "405":
          description: method_not_allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "409":
          description: invalid_state or nothing_to_retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
  /mutations/{id}:
    get:
      summary: Get a mutation protocol
      description: Returns the mutation protocol represented by the path id.
      operationId: getMutation
      parameters:
        - $ref: '#/components/parameters/MutationProtocolId'
      responses:
        "200":
          description: Mutation protocol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationProtocol'
        "404":
          description: protocol_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "405":
          description: method_not_allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
  /mutations/{id}/items:
    get:
      summary: List mutation items
      description: Mutation items are ordered by seq ascending. The cursor is opaque to clients.
      operationId: listMutationItems
      parameters:
        - $ref: '#/components/parameters/MutationProtocolId'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MutationItemState'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque base64 cursor returned by the previous page; its internal structure is not part of the API.
      responses:
        "200":
          description: Mutation items ordered by seq ASC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationItemPage'
        "400":
          description: invalid_filter or invalid_cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "404":
          description: protocol_not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
        "405":
          description: method_not_allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MutationErrorResponse'
  /catalog/products:
    get:
      summary: List paginated catalog product facts
      operationId: listCatalogProductFacts
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque base64 keyset cursor returned by the previous page.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: Cache-Control
          in: header
          required: false
          schema:
            type: string
          description: Set to no-cache to map FreshnessPolicy.MaxAge to zero.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductFactPage'
        "400":
          description: Invalid cursor or limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPageErrorResponse'
        "503":
          description: Catalog source unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPageErrorResponse'
        "504":
          description: Interactive deadline exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPageErrorResponse'
  /catalog/products/{id}:
    get:
      summary: Get a single catalog product
      operationId: getCatalogProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalCatalogProduct'
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /catalog/products/search:
    get:
      summary: Search paginated catalog product facts
      operationId: searchCatalogProductFacts
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - name: Cache-Control
          in: header
          required: false
          schema:
            type: string
          description: Set to no-cache to map FreshnessPolicy.MaxAge to zero.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductFactPage'
        "400":
          description: Invalid limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPageErrorResponse'
        "503":
          description: Catalog source unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPageErrorResponse'
        "504":
          description: Interactive deadline exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPageErrorResponse'
  /catalog/products/{id}/enrichment:
    get:
      summary: Get product enrichment data
      operationId: getProductEnrichment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEnrichment'
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Upsert product enrichment data
      operationId: upsertProductEnrichment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductEnrichment'
      responses:
        "200":
          description: Enrichment upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEnrichment'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /listings:
    get:
      summary: List marketplace listings
      operationId: listListings
      parameters:
        - name: installation_id
          in: query
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: filter.status
          in: query
          required: false
          schema:
            type: string
            enum: [active, paused, closed, unknown, under_review, inactive, payment_required, not_yet_active]
        - name: filter.sync_state
          in: query
          required: false
          schema:
            type: string
            enum: [synced, error, stale, queued, syncing, paused_sync]
        - name: filter.link_state
          in: query
          required: false
          schema:
            type: string
            enum: [unresolved, conflict, resolved, rejected]
        - name: filter.exception
          in: query
          required: false
          schema:
            type: string
            enum: [sync_error, stale, unlinked, below_margin]
        - name: filter.has_exception
          in: query
          required: false
          schema:
            type: boolean
        - name: filter.listing_type_code
          in: query
          required: false
          schema:
            type: string
        - name: filter.product_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingPage'
        "400":
          description: Installation or listing filter is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Installation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Listing source unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /listings/by-product:
    get:
      summary: List marketplace listings grouped by product
      operationId: listListingsByProduct
      parameters:
        - name: installation_id
          in: query
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: filter.status
          in: query
          required: false
          schema:
            type: string
            enum: [active, paused, closed, unknown, under_review, inactive, payment_required, not_yet_active]
        - name: filter.sync_state
          in: query
          required: false
          schema:
            type: string
            enum: [synced, error, stale, queued, syncing, paused_sync]
        - name: filter.link_state
          in: query
          required: false
          schema:
            type: string
            enum: [unresolved, conflict, resolved, rejected]
        - name: filter.exception
          in: query
          required: false
          schema:
            type: string
            enum: [sync_error, stale, unlinked, below_margin]
        - name: filter.has_exception
          in: query
          required: false
          schema:
            type: boolean
        - name: filter.listing_type_code
          in: query
          required: false
          schema:
            type: string
        - name: filter.product_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingGroupPage'
        "400":
          description: Installation or listing filter is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Installation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Listing source unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /listings/{id}:
    get:
      summary: Get a marketplace listing
      operationId: getListing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingDetail'
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal listing read error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /listings/summary:
    get:
      summary: Get marketplace listing summary
      operationId: getListingsSummary
      parameters:
        - name: installation_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingSummary'
        "400":
          description: Installation is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Installation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Listing source unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /listings/refresh:
    post:
      summary: Start an asynchronous listings refresh
      operationId: refreshListings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshListingsRequest'
      responses:
        "202":
          description: Listings refresh accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshListingsAccepted'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Installation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: A listings refresh is already queued or running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /listings/categories/{category_id}/attributes:
    get:
      summary: Get the attributes defined for a marketplace category
      description: >
        Contract reservation only: the handler and adapter arrive in M-06 F-01.
        Until then, the runtime returns 404 because this route is absent. The
        attributes array preserves provider order; it is not sorted by the
        runtime.
      operationId: getCategoryAttributes
      parameters:
        - name: category_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category attributes in provider order
          content:
            application/json:
              schema:
                type: object
                required: [category_id, attributes]
                properties:
                  category_id:
                    type: string
                  attributes:
                    type: array
                    description: Provider-order-preserving; the runtime does not sort this array.
                    items:
                      $ref: '#/components/schemas/CategoryAttribute'
        "404":
          description: Category was not found (category_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "502":
          description: Category attribute provider is unavailable (provider_unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /catalog/taxonomy:
    get:
      summary: List taxonomy nodes
      operationId: listTaxonomyNodes
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTaxonomyNodesResponse'
  /classifications:
    get:
      summary: List classifications
      operationId: listClassifications
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListClassificationsResponse'
    post:
      summary: Create classification
      operationId: createClassification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassificationRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classification'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /classifications/{id}:
    get:
      summary: Get classification with product IDs
      operationId: getClassification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classification'
        "404":
          description: Classification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update classification
      operationId: updateClassification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClassificationRequest'
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classification'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Classification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete classification
      operationId: deleteClassification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Classification deleted
        "404":
          description: Classification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /integrations/providers:
    get:
      summary: List integration provider definitions
      operationId: listIntegrationProviders
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIntegrationProvidersResponse'
  /integrations/installations:
    get:
      summary: List integration installations
      operationId: listIntegrationInstallations
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIntegrationInstallationsResponse'
    post:
      summary: Create integration installation
      operationId: createIntegrationInstallation
      requestBody:
        required: true
        content:
          application/json:
            schema:
