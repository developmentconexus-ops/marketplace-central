          description: Installation not found (installation_not_found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /erp/imports:
    post:
      summary: Import ERP product data from an XLSX file
      operationId: createErpImport
      tags: [erp-imports]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: ERP import created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpImportCreated'
        "400":
          description: Invalid ERP import file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpImportError'
        "409":
          description: Duplicate file or another ERP import is in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpImportConflict'
        "422":
          description: Required ERP import column is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpImportError'
        "500":
          description: Unexpected ERP import failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpImportError'
    get:
      summary: List ERP imports
      description: ERP imports are returned newest-first by imported_at, with import_id as the tiebreaker.
      operationId: listErpImports
      tags: [erp-imports]
      responses:
        "200":
          description: ERP import history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpImportList'
        "500":
          description: Unexpected ERP import failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErpImportError'

  /erp/imports/{id}:
    get:
      summary: Get an ERP import
      operationId: getErpImport
      tags: [erp-imports]
      parameters:
