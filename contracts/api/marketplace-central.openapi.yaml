openapi: 3.1.0
info:
  title: Marketplace Central API
  version: 2026-07-13
paths:
  /catalog/products:
    get:
      summary: List catalog products
      operationId: listCatalogProducts
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCatalogProductsResponse'
  /catalog/products/{id}:
    get:
      summary: Get a single catalog product
      operationId: getCatalogProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalCatalogProduct'
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /catalog/products/search:
    get:
      summary: Search catalog products
      operationId: searchCatalogProducts
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCatalogProductsResponse'
  /catalog/products/{id}/enrichment:
    get:
      summary: Get product enrichment data
      operationId: getProductEnrichment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEnrichment'
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Upsert product enrichment data
      operationId: upsertProductEnrichment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductEnrichment'
      responses:
        "200":
          description: Enrichment upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEnrichment'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /catalog/taxonomy:
    get:
      summary: List taxonomy nodes
      operationId: listTaxonomyNodes
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTaxonomyNodesResponse'
  /classifications:
    get:
      summary: List classifications
      operationId: listClassifications
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListClassificationsResponse'
    post:
      summary: Create classification
      operationId: createClassification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClassificationRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classification'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /classifications/{id}:
    get:
      summary: Get classification with product IDs
      operationId: getClassification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classification'
        "404":
          description: Classification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update classification
      operationId: updateClassification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClassificationRequest'
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classification'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Classification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete classification
      operationId: deleteClassification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Classification deleted
        "404":
          description: Classification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /integrations/providers:
    get:
      summary: List integration provider definitions
      operationId: listIntegrationProviders
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIntegrationProvidersResponse'
  /integrations/installations:
    get:
      summary: List integration installations
      operationId: listIntegrationInstallations
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIntegrationInstallationsResponse'
    post:
      summary: Create integration installation
      operationId: createIntegrationInstallation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationInstallationRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationInstallation'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /integrations/installations/{id}/auth/authorize:
    post:
      summary: Start OAuth authorization flow
      operationId: startIntegrationAuthorization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authorization URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
        "409":
          description: Invalid installation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /integrations/auth/callback:
    get:
      summary: OAuth callback endpoint
      operationId: handleIntegrationAuthCallback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: shop_id
          in: query
          required: false
          schema:
            type: string
          description: Optional Shopee shop identifier used when mapping the provider account ID.
        - name: merchant_id
          in: query
          required: false
          schema:
            type: string
          description: Optional merchant identifier used when mapping the provider account ID.
        - name: selling_partner_id
          in: query
          required: false
          schema:
            type: string
          description: Optional provider account identifier fallback used by SP-API callbacks.
      responses:
        "302":
          description: Redirects to frontend connection status page
  /integrations/installations/{id}/auth/credentials:
    post:
      summary: Submit API key credentials
      operationId: submitIntegrationCredentials
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAPIKeyRequest'
      responses:
        "200":
          description: Credentials accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
  /integrations/installations/{id}/disconnect:
    post:
      summary: Disconnect integration installation
      operationId: disconnectIntegrationInstallation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Installation disconnected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
  /integrations/installations/{id}/reauth/authorize:
    post:
      summary: Start reauthorization flow
      operationId: startIntegrationReauthorization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reauthorization URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
  /integrations/installations/{id}/auth/status:
    get:
      summary: Read integration auth status
      operationId: getIntegrationAuthStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Installation auth status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
  /integrations/installations/{id}/fee-sync:
    post:
      summary: Start installation fee sync
      operationId: startIntegrationFeeSync
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Fee sync accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationFeeSyncAccepted'
        "400":
          description: Invalid request or unsupported installation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /integrations/installations/{id}/operations:
    get:
      summary: List installation operation runs
      operationId: listIntegrationOperationRuns
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Installation operation runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIntegrationOperationRunsResponse'
  /integrations/installations/{id}/probes/account:
    post:
      summary: Probe installation account snapshot
      operationId: probeIntegrationAccount
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Installation account probe snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationAccountProbe'
  /integrations/installations/{id}/probes/listings:
    get:
      summary: Probe installation listing snapshots
      operationId: probeIntegrationListings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Installation listing probe snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIntegrationListingProbesResponse'
  /integrations/installations/{id}/probes/orders:
    get:
      summary: Probe installation order snapshots
      operationId: probeIntegrationOrders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Installation order probe snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIntegrationOrderProbesResponse'
  /integrations/installations/{id}/probes/fee-quote:
    get:
      summary: Probe installation fee quote snapshot
      operationId: probeIntegrationFeeQuote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: listing_type_id
          in: query
          required: true
          schema:
            type: string
        - name: price
          in: query
          required: true
          schema:
            type: number
            format: double
            exclusiveMinimum: 0
        - name: site_id
          in: query
          required: false
          schema:
            type: string
        - name: category_id
          in: query
          required: false
          schema:
            type: string
        - name: currency_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Installation fee quote probe snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationFeeQuoteSnapshot'
  /integrations/installations/{id}/probes/stock:
    get:
      summary: Probe installation stock snapshot
      operationId: probeIntegrationStock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: provider_item_id
          in: query
          required: true
          schema:
            type: string
        - name: provider_variation_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Installation stock probe snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationStockProbe'
  /product-links/listing-snapshots/imports:
    post:
      summary: Import normalized listing snapshots for product linking
      operationId: importProductLinkListingSnapshots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportProductLinkListingSnapshotsRequest'
      responses:
        "200":
          description: Listing snapshots imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLinkListingSnapshotImportResult'
  /product-links/link-candidates/generations:
    post:
      summary: Generate product link candidates
      operationId: generateProductLinkCandidates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateProductLinkCandidatesRequest'
      responses:
        "200":
          description: Product link candidates generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLinkCandidateGenerationResult'
  /product-links/link-candidates:
    get:
      summary: List product link candidates
      operationId: listProductLinkCandidates
      parameters:
        - name: installation_id
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Product link candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProductLinkCandidatesResponse'
  /product-links/link-workflows:
    get:
      summary: List product link workflows
      operationId: listProductLinkWorkflows
      parameters:
        - name: installation_id
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Product link workflows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProductLinkWorkflowsResponse'
  /product-links/link-resolutions/approve-candidate:
    post:
      summary: Approve a product link candidate
      operationId: approveProductLinkCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveProductLinkCandidateRequest'
      responses:
        "200":
          description: Product link resolved from candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLinkResolutionResult'
  /product-links/link-resolutions/reject-listing:
    post:
      summary: Reject a listing identity for product linking
      operationId: rejectProductLinkListing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectProductLinkListingRequest'
      responses:
        "200":
          description: Product link listing rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLinkResolutionResult'
  /product-links/link-resolutions/manual-resolve:
    post:
      summary: Manually resolve a listing identity to an internal product
      operationId: manualResolveProductLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualResolveProductLinkRequest'
      responses:
        "200":
          description: Product link manually resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLinkResolutionResult'
  /inventory/stock-risks:
    get:
      summary: List persisted Stock Seguro risk rows
      operationId: listInventoryStockRisks
      parameters:
        - name: installation_id
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StockRiskState'
        - name: link_state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductLinkState'
        - name: actionability
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StockRiskActionability'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: Stock Seguro rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInventoryStockRisksResponse'
  /inventory/stock-actions/manual-apply:
    post:
      summary: Apply a confirmatory manual Stock Seguro action
      operationId: applyInventoryManualStockAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyInventoryManualStockActionRequest'
      responses:
        "200":
          description: Manual stock action accepted and audited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyInventoryManualStockActionResponse'
  /orders/import:
    post:
      summary: Import normalized marketplace orders for an installation
      operationId: importMarketplaceOrders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportMarketplaceOrdersRequest'
      responses:
        "200":
          description: Orders imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportMarketplaceOrdersResponse'
  /orders:
    get:
      summary: List persisted marketplace order snapshots
      operationId: listMarketplaceOrders
      parameters:
        - name: installation_id
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Persisted marketplace orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMarketplaceOrdersResponse'
  /orders/{provider_order_id}/sankhya-linkage:
    get:
      summary: Get the current exact assisted Sankhya linkage
      operationId: getAssistedSankhyaLinkage
      parameters:
        - name: provider_order_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: installation_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Current exact assisted Sankhya linkage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistedSankhyaLinkageResponse'
        "400":
          description: Invalid exact scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Scoped order or linkage not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Persisted linkage conflicts with the active runtime evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Assisted linkage runtime unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orders/{provider_order_id}/sankhya-linkage/candidates:
    get:
      summary: List exact bounded TOP 313 candidates for assisted linkage
      operationId: listAssistedSankhyaLinkageCandidates
      parameters:
        - name: provider_order_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: installation_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Exact bounded candidate list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistedSankhyaCandidateListResponse'
        "400":
          description: Invalid exact scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Scoped order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Candidate evidence is ambiguous or conflicting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Assisted linkage runtime or Oracle source unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orders/{provider_order_id}/sankhya-linkage/confirm:
    post:
      summary: Confirm one exact assisted Sankhya document and line mapping
      operationId: confirmAssistedSankhyaLinkage
      parameters:
        - name: provider_order_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: installation_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmAssistedSankhyaLinkageRequest'
      responses:
        "200":
          description: Persisted exact linkage and current descendant states
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmAssistedSankhyaLinkageResponse'
        "400":
          description: Invalid request, audit intent, or non-bijective selection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Scoped order or selected candidate not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Idempotency, origin, or candidate conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: Assisted linkage runtime or Oracle source unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /profitability/margin-inputs/import:
    post:
      summary: Import profitability margin inputs from persisted orders
      operationId: importProfitabilityMarginInputs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportProfitabilityMarginInputsRequest'
      responses:
        "200":
          description: Profitability inputs imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportProfitabilityMarginInputsResponse'
  /profitability/margin-inputs:
    get:
      summary: List persisted profitability margin inputs
      operationId: listProfitabilityMarginInputs
      parameters:
        - name: installation_id
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: Persisted profitability inputs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProfitabilityMarginInputsResponse'
  /profitability/manual-adjustments:
    get:
      summary: List profitability manual adjustments
      operationId: listProfitabilityManualAdjustments
