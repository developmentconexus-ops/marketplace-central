        translated_error_code:
          type: string
        attempt_count:
          type: integer
        duration_ms:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true

    SyncRunPage:
      type: object
      required: [items, next_cursor, page_size, as_of]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncRun'
        next_cursor:
          type: string
          nullable: true
        page_size:
          type: integer
          minimum: 0
        as_of:
          type: string
          format: date-time

    MarketMoney:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
        currency:
          type: string
          enum: [BRL]

    MarketCatalogStats:
      type: object
      required: [min, p25, median, trimmed_mean, p75, max, n_offers, n_sellers]
      properties:
        min:
          type: string
        p25:
          type: string
        median:
          type: string
        trimmed_mean:
          type: string
        p75:
          type: string
        max:
          type: string
        n_offers:
          type: integer
        n_sellers:
          type: integer

    MarketObservation:
      type: object
      description: >-
        Independent market signals remain separate: no synthetic aggregate price is
        created. Stored rows always carry source and captured_at; null provenance is
        reserved for synthetic no-price-evidence items.
      required: [listing_id, our_sale_price, competitive_status, winner_price, competitive_target, catalog_offer_price, catalog_stats, evidence_state, captured_at, source]
      properties:
        listing_id:
          type: string
        our_sale_price:
          allOf:
            - $ref: '#/components/schemas/MarketMoney'
          nullable: true
        competitive_status:
          type: string
          enum: [winning, competing, not_listed]
          nullable: true
        winner_price:
          allOf:
            - $ref: '#/components/schemas/MarketMoney'
          nullable: true
        competitive_target:
          allOf:
            - $ref: '#/components/schemas/MarketMoney'
          nullable: true
        catalog_offer_price:
          allOf:
            - $ref: '#/components/schemas/MarketMoney'
          nullable: true
        catalog_stats:
          allOf:
            - $ref: '#/components/schemas/MarketCatalogStats'
          nullable: true
        evidence_state:
          type: string
          enum: [observed, insufficient_market, no_price_evidence]
        captured_at:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          enum: [official_api, vendor, manual]
          nullable: true

    MarketReference:
      type: object
      description: Independent catalog evidence; it carries no derived aggregate price.
      required: [product_id, catalog_product_id, match_state, match_method, catalog_stats, evidence_state, captured_at, source]
      properties:
        product_id:
          type: string
        catalog_product_id:
          type: string
          nullable: true
        match_state:
          type: string
          enum: [accept, review, reject, no_candidate]
        match_method:
          type: string
          nullable: true
        catalog_stats:
          allOf:
            - $ref: '#/components/schemas/MarketCatalogStats'
          nullable: true
        evidence_state:
          type: string
          enum: [observed, insufficient_market, no_price_evidence]
        captured_at:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          enum: [official_api, vendor, manual]
          nullable: true

    MarketCollectionRequest:
      type: object
      required: [codprod]
      additionalProperties: false
      properties:
        codprod:
          type: string

    MarketCollectionDecision:
      type: object
      required: [codprod, match_status, price_evidence_status, blocking_state]
      properties:
        codprod:
          type: string
        match_status:
          type: string
          enum: [ACCEPT, REVIEW, REJECT, NO_CANDIDATE]
        price_evidence_status:
          type: string
          enum: [OK, INSUFFICIENT_MARKET, NO_PRICE_EVIDENCE]
        blocking_state:
          type: string
          enum: [NO_CANDIDATE, NO_PRICE_EVIDENCE, INSUFFICIENT_MARKET, SEM_CUSTO]
          nullable: true

    MarketCollectionCause:
      type: object
      required: [codprod, reason, detail]
      properties:
        codprod:
          type: string
        reason:
          type: string
          enum: [NO_IDENTITY, FLAG_DISABLED, PROVIDER_4XX, PROVIDER_5XX, TIMEOUT, PRICE_UNAVAILABLE]
        detail:
          type: string
          nullable: true

    MarketCollectionResponse:
      type: object
      description: >-
        B.1 synchronous collection envelope (single product, D-F4-p).
        decisões/contagens/causas keys are verbatim per the IC-06/IC-03
        amendment; contagens is a full five-key snake_case count map.
      required: ["status", "decisões", contagens, causas]
      properties:
        status:
          type: string
          enum: [COMPLETED, PARTIAL]
        decisões:
          type: array
          items:
            $ref: '#/components/schemas/MarketCollectionDecision'
        contagens:
          type: object
          required: [ok, no_price_evidence, insufficient_market, no_candidate, sem_custo]
          properties:
            ok:
              type: integer
            no_price_evidence:
              type: integer
            insufficient_market:
              type: integer
            no_candidate:
              type: integer
            sem_custo:
              type: integer
        causas:
          type: array
          items:
            $ref: '#/components/schemas/MarketCollectionCause'

    MarketPosition:
      type: object
      required: [rank, total]
      properties:
        rank:
          type: integer
        total:
          type: integer

    MarketCompetitiveSignal:
      type: object
      required: [listing_id, our_price, winner_price, target_price, position, fetched_at]
      properties:
        listing_id:
          type: string
        our_price:
          allOf:
            - $ref: '#/components/schemas/MarketMoney'
          nullable: true
        winner_price:
          allOf:
            - $ref: '#/components/schemas/MarketMoney'
          nullable: true
        target_price:
          allOf:
            - $ref: '#/components/schemas/MarketMoney'
          nullable: true
        position:
          allOf:
            - $ref: '#/components/schemas/MarketPosition'
          nullable: true
        fetched_at:
          type: string
          format: date-time

    MarketAggregate:
      type: object
      required: [product_id, median, min_valid, n_offers, n_sellers, source, fetched_at, computed_at, status]
      properties:
        product_id:
          type: string
        median:
          allOf:
            - $ref: '#/components/schemas/MarketMoney'
          nullable: true
        min_valid:
          allOf:
            - $ref: '#/components/schemas/MarketMoney'
          nullable: true
        n_offers:
          type: integer
        n_sellers:
          type: integer
        source:
          type: string
          enum: [ml_sale_price, ml_price_to_win, ml_catalog_offers]
        fetched_at:
          type: string
          format: date-time
        computed_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [OK, INSUFFICIENT_MARKET, NO_PRICE_EVIDENCE]

    MarketVerdictInputRef:
      type: object
      required: [source, as_of]
      properties:
        source:
          type: string
        as_of:
          type: string
          format: date-time

    MarketVerdictMarketRange:
      type: object
      description: Mirrors the frozen MarketAggregate exactly; deliberately no max field.
      required: [min_valid, median, currency, n_offers, n_sellers]
      properties:
        min_valid:
          allOf:
            - $ref: '#/components/schemas/MarketMoney'
          nullable: true
        median:
          allOf:
            - $ref: '#/components/schemas/MarketMoney'
          nullable: true
        currency:
          type: string
          enum: [BRL]
        n_offers:
          type: integer
        n_sellers:
          type: integer

    MarketVerdict:
      type: object
      required: [match_status, price_evidence_status, verdict_label, blocking_state, inputs_used, market_range]
      properties:
        match_status:
          type: string
          enum: [ACCEPT, REVIEW, REJECT, NO_CANDIDATE]
        price_evidence_status:
          type: string
          enum: [OK, INSUFFICIENT_MARKET, NO_PRICE_EVIDENCE]
        verdict_label:
          type: string
          nullable: true
          description: Always null from M-02; margin labels are M-07-owned.
        blocking_state:
          type: string
          enum: [NO_CANDIDATE, NO_PRICE_EVIDENCE, INSUFFICIENT_MARKET, SEM_CUSTO]
          nullable: true
        inputs_used:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MarketVerdictInputRef'
        market_range:
          allOf:
            - $ref: '#/components/schemas/MarketVerdictMarketRange'
          nullable: true

    MutationType:
      type: string
      description: listing_create is reserved in the protocol enum but currently disabled and returns type_not_enabled.
      enum: [price_update, stock_correct, link_apply, listing_pause, listing_resync, listing_edit, listing_create]

    MutationState:
      type: string
      enum: [draft, previewed, approved, applying, applied, partially_failed, failed_preserved, cancelled]

    MutationItemState:
      type: string
      enum: [previewed, approved, applying, applied, failed, skipped]

    CreateMutationRequest:
      type: object
      required: [installation_id, type, actor, intent, selection]
      additionalProperties: false
      properties:
        installation_id: { type: string }
        type: { $ref: '#/components/schemas/MutationType' }
        actor: { type: string }
        intent: { type: object, additionalProperties: true }
        selection: { type: object, additionalProperties: true }

    ApproveMutationRequest:
      type: object
      required: [execute]
      additionalProperties: false
      properties:
        execute:
          type: boolean
          const: true

    MutationProtocol:
      type: object
      required: [protocol_id, installation_id, type, state, actor, intent, selection, totals, source_as_of, retried_from, created_at, previewed_at, approved_at, finished_at]
      properties:
        protocol_id: { type: string }
        installation_id: { type: string }
        type: { $ref: '#/components/schemas/MutationType' }
        state: { $ref: '#/components/schemas/MutationState' }
        actor: { type: string }
        intent: { type: object, additionalProperties: true }
        selection: { type: object, additionalProperties: true }
        totals: { type: object, additionalProperties: true }
        source_as_of: { type: string, format: date-time, nullable: true }
        retried_from: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        previewed_at: { type: string, format: date-time, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    MutationItem:
      type: object
      required: [seq, item_id, listing_id, idempotency_key, before, after, state, failure, applied_at]
      properties:
        seq: { type: integer }
        item_id: { type: string }
        listing_id: { type: string }
        idempotency_key: { type: string }
        before: { type: object, additionalProperties: true, nullable: true }
        after: { type: object, additionalProperties: true }
        state: { $ref: '#/components/schemas/MutationItemState' }
        failure: { type: object, additionalProperties: true, nullable: true }
        applied_at: { type: string, format: date-time, nullable: true }

    MutationPreview:
      allOf:
        - $ref: '#/components/schemas/MutationProtocol'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MutationItem'

    MutationProtocolPage:
      type: object
      required: [items, next_cursor, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MutationProtocol'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null when there is no next page.
        page_size:
          type: integer

    MutationItemPage:
      type: object
      required: [items, next_cursor, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MutationItem'
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null when there is no next page.
        page_size:
          type: integer

    MutationErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [invalid_body, invalid_intent, installation_required, invalid_filter, invalid_cursor, actor_required, type_not_enabled, empty_selection, selection_too_large, execute_required, source_time_unavailable, preview_stale, invalid_state, nothing_to_retry, protocol_not_found, method_not_allowed]
            message: { type: string }
            details: { type: object, additionalProperties: true }

    ErpImportStatus:
      type: string
      enum: [COMPLETED, REJECTED]

    ErpImportCreated:
      type: object
      required: [import_id, protocol, status]
      properties:
        import_id:
          type: string
        protocol:
          type: string
        status:
          $ref: '#/components/schemas/ErpImportStatus'

    ErpImportSummary:
      type: object
      description: One persisted ERP import summary.
      required: [import_id, protocol, file_sha256, source, imported_at, status, accepted_count, rejected_count, warning_count]
      properties:
        import_id:
          type: string
        protocol:
          type: string
        file_sha256:
          type: string
        source:
          type: string
          enum: [xlsx]
        imported_at:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp.
        status:
          $ref: '#/components/schemas/ErpImportStatus'
        accepted_count:
          type: integer
        rejected_count:
          type: integer
        warning_count:
          type: integer

    ErpImportIssueCode:
      type: string
      enum: [EMPTY_CODPROD, DUPLICATE_CODPROD, EMPTY_DESCRPROD, INVALID_CUSTO, INVALID_ESTOQUE, INVALID_EAN, INVALID_NCM]

    ErpImportIssue:
      type: object
      required: [row, code, detail]
      properties:
        row:
          type: integer
        code:
          $ref: '#/components/schemas/ErpImportIssueCode'
        detail:
          type: string
        column:
          type: string
          nullable: true
        offending_value:
          type: string
          nullable: true

    ErpImportDetail:
      allOf:
        - $ref: '#/components/schemas/ErpImportSummary'
        - type: object
          required: [rejected_rows, warnings]
          properties:
            rejected_rows:
              type: array
              items:
                $ref: '#/components/schemas/ErpImportIssue'
            warnings:
              type: array
              items:
                $ref: '#/components/schemas/ErpImportIssue'

    ErpImportList:
      type: object
      description: ERP imports ordered newest-first by imported_at, with import_id as the tiebreaker.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ErpImportSummary'

    ErpImportError:
      type: object
      description: Flat ERP import error body.
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_file, missing_required_column, import_not_found, internal_error]
        detail:
          type: string
        column:
          type: string

    ErpImportConflict:
      type: object
      description: Flat ERP import conflict body.
      required: [error]
      properties:
        error:
          type: string
          enum: [duplicate_file, import_in_progress]
        import_id:
          type: string
        protocol:
          type: string
