      responses:
        "200":
          description: OAuth connection status
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected:
                    type: boolean
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorErrorResponse'
        "500":
          description: Failed to read token state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorErrorResponse'

components:
  schemas:
    CanonicalNumericSourceFact:
      type: object
      required: [source, value, quality, observed_at, quality_reason]
      properties:
        source:
          type: string
        value:
          type: number
          nullable: true
        quality:
          type: string
          enum: [current, stale, unknown, conflict]
        observed_at:
          type: string
          format: date-time
          nullable: true
        quality_reason:
          type: string
          nullable: true
    CanonicalCatalogProduct:
      type: object
      required: [internal_product_id, name, ean, manufacturer_reference, seller_sku, brand_name, product_group_name, cost_amount, price_amount, stock_quantity]
      properties:
        internal_product_id:
          type: integer
          minimum: 1
        name:
          type: string
        ean:
          type: string
          nullable: true
        manufacturer_reference:
          type: string
          nullable: true
        seller_sku:
          type: string
          nullable: true
        brand_name:
          type: string
          nullable: true
        product_group_name:
          type: string
          nullable: true
        cost_amount:
          $ref: '#/components/schemas/CanonicalNumericSourceFact'
        price_amount:
          $ref: '#/components/schemas/CanonicalNumericSourceFact'
        stock_quantity:
          $ref: '#/components/schemas/CanonicalNumericSourceFact'
    CatalogProduct:
      type: object
      properties:
        product_id:
          type: string
        sku:
          type: string
        name:
          type: string
        description:
          type: string
        brand_name:
          type: string
        status:
          type: string
        cost_amount:
          type: number
        price_amount:
          type: number
        stock_quantity:
          type: number
        ean:
          type: string
        reference:
          type: string
        taxonomy_node_id:
          type: string
        taxonomy_name:
          type: string
        suggested_price:
          type: number
          nullable: true
        height_cm:
          type: number
          nullable: true
        width_cm:
          type: number
          nullable: true
        length_cm:
          type: number
          nullable: true
        weight_g:
          type: number
          nullable: true
    TaxonomyNode:
      type: object
      properties:
        node_id:
          type: string
        name:
          type: string
        level:
          type: integer
        level_label:
          type: string
        parent_node_id:
          type: string
        is_active:
          type: boolean
        product_count:
          type: integer
    ProductEnrichment:
      type: object
      properties:
        product_id:
          type: string
        height_cm:
          type: number
          nullable: true
        width_cm:
          type: number
          nullable: true
        length_cm:
          type: number
          nullable: true
        weight_g:
          type: number
          nullable: true
        suggested_price_amount:
          type: number
          nullable: true
    Classification:
      type: object
      properties:
        classification_id:
          type: string
        name:
          type: string
        ai_context:
          type: string
        product_ids:
          type: array
          items:
            type: string
        product_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ClassificationSummary:
      type: object
      properties:
        classification_id:
          type: string
        name:
          type: string
        ai_context:
          type: string
        product_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateClassificationRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        ai_context:
          type: string
        product_ids:
          type: array
          items:
            type: string
    UpdateClassificationRequest:
      type: object
      properties:
        name:
          type: string
        ai_context:
          type: string
        product_ids:
          type: array
          items:
            type: string
    MarketplaceAccount:
      type: object
      required:
        - account_id
        - tenant_id
        - channel_code
        - marketplace_code
        - display_name
        - status
        - connection_mode
      properties:
        account_id:
          type: string
        tenant_id:
          type: string
        channel_code:
          type: string
        marketplace_code:
          type: string
        display_name:
          type: string
        status:
          type: string
        connection_mode:
          type: string
    CreateMarketplaceAccountRequest:
      type: object
      required:
        - account_id
        - channel_code
        - display_name
        - connection_mode
      properties:
        account_id:
          type: string
        channel_code:
          type: string
        display_name:
          type: string
        connection_mode:
          type: string
        marketplace_code:
          type: string
          description: "Registered marketplace plugin code (e.g. mercado_livre, shopee, magalu)."
        credentials_json:
          type: object
          additionalProperties:
            type: string
          description: "Credential key-value pairs matching credential_schema. Write-only — not returned in list responses."
    MarketplacePolicy:
      type: object
      required:
        - policy_id
        - tenant_id
        - account_id
        - commission_percent
        - fixed_fee_amount
        - default_shipping
        - tax_percent
        - min_margin_percent
        - sla_question_minutes
        - sla_dispatch_hours
        - shipping_provider
      properties:
        policy_id:
          type: string
        tenant_id:
          type: string
        account_id:
          type: string
        marketplace_code:
          type: string
          description: "The marketplace this policy applies to."
        commission_percent:
          type: number
          format: double
        commission_override:
          type: number
          format: double
          nullable: true
          description: "Tenant-specific override. Null = standard fee schedule applies."
        fixed_fee_amount:
          type: number
          format: double
        default_shipping:
          type: number
          format: double
        tax_percent:
          type: number
          format: double
          description: "Server-derived. Currently always 0."
        min_margin_percent:
          type: number
          format: double
        sla_question_minutes:
          type: integer
        sla_dispatch_hours:
          type: integer
        shipping_provider:
          type: string
          enum: [fixed, melhor_envio, marketplace]
          default: fixed
          description: "Normalized by the backend. Blank input defaults to fixed."
    CreateMarketplacePolicyRequest:
      type: object
      required:
        - policy_id
        - account_id
        - commission_percent
        - fixed_fee_amount
        - default_shipping
        - min_margin_percent
        - sla_question_minutes
        - sla_dispatch_hours
      properties:
        policy_id:
          type: string
        account_id:
          type: string
        commission_percent:
          type: number
          format: double
        commission_override:
          type: number
          format: double
          nullable: true
          description: "When set, overrides fee_schedules lookup. Null = use standard schedule."
        fixed_fee_amount:
          type: number
          format: double
        default_shipping:
          type: number
          format: double
        min_margin_percent:
          type: number
          format: double
        sla_question_minutes:
          type: integer
        sla_dispatch_hours:
          type: integer
        shipping_provider:
          type: string
          enum: [fixed, melhor_envio, marketplace]
          default: fixed
          description: "Optional. The backend trims whitespace, lowercases the value, and defaults blank/omitted input to fixed."
    PricingSimulation:
      type: object
      required:
        - simulation_id
        - tenant_id
        - product_id
        - account_id
        - margin_amount
        - margin_percent
        - status
      properties:
        simulation_id:
          type: string
        tenant_id:
          type: string
        product_id:
          type: string
        account_id:
          type: string
        margin_amount:
          type: number
          format: double
        margin_percent:
          type: number
          format: double
        status:
          type: string
    BatchSimulationItem:
      type: object
      required:
        - product_id
        - policy_id
        - selling_price
        - cost_amount
        - commission_amount
        - freight_amount
        - fixed_fee_amount
        - margin_amount
        - margin_percent
        - status
        - freight_source
      properties:
        product_id:
          type: string
        policy_id:
          type: string
        selling_price:
          type: number
          format: double
        cost_amount:
          type: number
          format: double
        commission_amount:
          type: number
          format: double
        freight_amount:
          type: number
          format: double
        fixed_fee_amount:
          type: number
          format: double
        margin_amount:
          type: number
          format: double
        margin_percent:
          type: number
          format: double
        status:
          type: string
          enum: [healthy, warning, critical]
        freight_source:
          type: string
          enum: [melhor_envio, fixed, no_dimensions, me_error, me_not_connected]
    RunPricingSimulationRequest:
      type: object
      required:
        - simulation_id
        - product_id
        - account_id
        - base_price_amount
        - commission_percent
        - fixed_fee_amount
        - shipping_amount
        - min_margin_percent
      properties:
        simulation_id:
          type: string
        product_id:
          type: string
        account_id:
          type: string
        base_price_amount:
          type: number
          format: double
        cost_amount:
          type: number
          format: double
          description: "Optional. If not provided, the backend resolves cost from MetalShopping catalog."
        commission_percent:
          type: number
          format: double
        fixed_fee_amount:
          type: number
          format: double
        shipping_amount:
          type: number
          format: double
        min_margin_percent:
          type: number
          format: double
    RunPricingBatchRequest:
      type: object
      required:
        - product_ids
        - policy_ids
        - origin_cep
        - destination_cep
      properties:
        product_ids:
          type: array
          items:
            type: string
        policy_ids:
          type: array
          items:
            type: string
        origin_cep:
          type: string
        destination_cep:
          type: string
        price_source:
          type: string
          enum: [my_price, suggested_price]
        price_overrides:
          type: object
          additionalProperties:
            type: number
            format: double
          description: "Optional. Map of productID::policyID to override price."
    RunPricingBatchResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchSimulationItem'
    ListCatalogProductsResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CanonicalCatalogProduct'
    ListTaxonomyNodesResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyNode'
    ListClassificationsResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Classification'
    ListMarketplaceAccountsResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceAccount'
    ListMarketplacePoliciesResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MarketplacePolicy'
    ListPricingSimulationsResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PricingSimulation'
    ListIntegrationProvidersResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationProviderDefinition'
    ListIntegrationInstallationsResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationInstallation'
    ProductForPublish:
      type: object
      required:
        - product_id
        - name
        - sku_name
        - ean
        - category
        - brand
        - base_price
      properties:
        product_id:
          type: string
        name:
          type: string
        description:
          type: string
        sku_name:
          type: string
        ean:
          type: string
        category:
          type: string
        brand:
          type: string
        cost:
          type: number
          format: double
        base_price:
          type: number
          format: double
        image_urls:
          type: array
          items:
            type: string
        specs:
          type: object
          additionalProperties:
            type: string
        stock_qty:
          type: integer
        warehouse_id:
          type: string
        trade_policy_id:
          type: string

    MarketplaceDefinition:
      type: object
      required: [code, display_name, auth_strategy, is_active, capability_profile, metadata]
      properties:
        code:
          type: string
          example: mercado_livre
        display_name:
          type: string
          example: Mercado Livre
        auth_strategy:
          type: string
          enum: [oauth2, lwa, shopee_partner, api_key, token, unknown]
        is_active:
          type: boolean
        capability_profile:
          $ref: '#/components/schemas/CapabilityProfile'
        metadata:
          $ref: '#/components/schemas/PluginMetadata'

    IntegrationProviderDefinition:
      type: object
      required:
        - provider_code
        - tenant_id
        - family
        - display_name
        - auth_strategy
        - install_mode
        - declared_capabilities
        - is_active
        - created_at
        - updated_at
      properties:
        provider_code:
          type: string
        tenant_id:
          type: string
        family:
          type: string
          enum: [marketplace]
        display_name:
          type: string
        auth_strategy:
          type: string
          enum: [oauth2, lwa, shopee_partner, api_key, token, none, unknown]
        install_mode:
          type: string
